<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazy Layout Home</title>
<!-- Copied from the editor prototype: font link and theme init -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500&family=Playfair+Display:wght@400;500&display=swap">
<script>try{var t=localStorage.getItem('ll-theme-v2');document.documentElement.dataset.theme=['paper','dark','white','warm','lilac','graphite','darkroom','noir'].indexOf(t)>-1?t:'warm'}catch(e){document.documentElement.dataset.theme='warm'}</script>
<style>
/* Copied from the editor prototype: root tokens, base CSS, buttons, app grid */
/* Design mode, blocked layout. PALETTE.md dark. No accent, no pills, no glass, no gradients in chrome. */
:root{
  --sans:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
  --r-sm:4px;--r-md:6px;--r-lg:8px;
  --ruler:18px;
  /* Motion tokens. The spring engine (ported from Nook) writes the pop curve for the active feel (Smooth, Lively or Bouncy). These defaults hold until it runs. */
  --ll-ease-pop:ease-out;--ll-dur-pop:200ms;--ll-dur-fade:120ms;
}
*{box-sizing:border-box;margin:0;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
html,body{height:100%}
body{background:var(--canvas);color:var(--text);font:13px/1.4 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
.defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.micro{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
.sp{flex:1}
.hl{height:1px;background:var(--border);margin:4px 0;flex:none}
.hide{display:none!important}
.ib{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--text2);flex:none}
.ib:hover{background:var(--seg);color:var(--text)}
[data-theme=dark] .ftool .ib[aria-pressed=true],[data-theme=graphite] .ftool .ib[aria-pressed=true],[data-theme=darkroom] .ftool .ib[aria-pressed=true],[data-theme=noir] .ftool .ib[aria-pressed=true]{background:var(--seg)}
.ib[aria-pressed=true]{background:var(--sel);color:var(--sel-fg)}
.ib.more{font:600 13px/1 var(--sans);letter-spacing:.08em}
.btn{height:32px;padding:0 12px;border-radius:var(--r-md);font-weight:500;border:1px solid var(--border);display:flex;align-items:center;gap:6px;color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.strong{background:var(--panel);color:var(--text);border-color:var(--text)}
.btn:disabled{background:var(--canvas);color:var(--muted);border-color:var(--border);cursor:not-allowed}
.wfull{width:100%;justify-content:center}

.app{display:grid;position:relative;height:100%;overflow:hidden;--lw:248px;--rw:320px;--bh:0px;--fw:0;
  grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);
  grid-template-rows:52px minmax(0,1fr) var(--bh)}
.app[data-fw="1"]{--fw:1}
.app[data-mode=motion]{--bh:clamp(180px,var(--mbh,40vh),70vh)}
.app[data-mode=code]{--bh:clamp(180px,var(--mbh,40vh),70vh)}
.app.lc{--lw:0px}.app.rc{--rw:0px}
@media (max-width:1200px){.app{--rw:296px}}
.app.lc .left,.app.rc .right{visibility:hidden}
.app.zen{grid-template-columns:0 minmax(0,1fr) 0;grid-template-rows:0 minmax(0,1fr) 0}
.app.zen .top,.app.zen .left,.app.zen .right,.app.zen .bottom,.app.zen .fbar{visibility:hidden}
.zenhint{position:absolute;left:50%;top:8px;transform:translateX(-50%);font:500 11px var(--mono);color:var(--muted);display:none;z-index:9}
.app.zen .zenhint{display:block}

/* Copied from the editor prototype: TOP BAR, theme blocks, menus, dropdowns, shared motion */
/* ===== TOP BAR (52px, same when panels collapse) ===== */
/* Semantic theme tokens. dark is the default (:root). Components use only these. */
:root,[data-theme=dark]{--seg:#444444;--backdrop:#141414;--canvas:#1E1E1E;--panel:#2C2C2C;--bar:#383838;--border:#444444;--text:#FFFFFF;--text2:#BFBFBF;--muted:#A1A1A1;--ctl:#FFFFFF;--ctl-fg:#1E1E1E;--float:#383838;--hover:#2C2C2C;--sel:#383838;--sel-fg:#FFFFFF;--shipbg:#383838;--ship-fg:#FFFFFF;--avatar:#444444;--avatar-fg:#FFFFFF;--sw-fill:#2C2C2C;--sw-a:#FFFFFF;--board:#383838;--boardline:#444444;--ph:#2C2C2C;--swline:#444444;--thumb:#1E1E1E;--thumbline:#444444;--shadow:0 4px 16px rgba(0,0,0,.5)}
[data-theme=white]{--seg:#F0F0F0;--backdrop:#F5F5F5;--canvas:#F5F5F5;--panel:#FFFFFF;--bar:#F0F0F0;--border:#E3E3E3;--text:#000000;--text2:#5C5C5C;--muted:#6B6B6B;--ctl:#000000;--ctl-fg:#FFFFFF;--float:#FFFFFF;--hover:#F0F0F0;--sel:#F0F0F0;--sel-fg:#000000;--shipbg:#F0F0F0;--ship-fg:#000000;--avatar:#F0F0F0;--avatar-fg:#000000;--sw-fill:#FFFFFF;--sw-a:#000000;--board:#FFFFFF;--boardline:#E3E3E3;--ph:#F0F0F0;--swline:#C8C8C8;--thumb:#F5F5F5;--thumbline:#E3E3E3;--shadow:0 4px 16px rgba(0,0,0,.12)}
[data-theme=warm]{--seg:#E3DBCC;--backdrop:#F3F0E9;--canvas:#F3F0E9;--panel:#FDFCF8;--bar:#F3F0E9;--border:#E3DBCC;--text:#101010;--text2:#5A5549;--muted:#6E6859;--ctl:#101010;--ctl-fg:#FDFCF8;--float:#FDFCF8;--hover:#E3DBCC;--sel:#E3DBCC;--sel-fg:#101010;--shipbg:#F3F0E9;--ship-fg:#101010;--avatar:#E3DBCC;--avatar-fg:#101010;--sw-fill:#E3DBCC;--sw-a:#101010;--board:#FFFFFF;--boardline:#E3DBCC;--ph:#E3DBCC;--swline:#E3DBCC;--thumb:#F3F0E9;--thumbline:#E3DBCC;--shadow:0 4px 16px rgba(16,16,16,.08)}
[data-theme=lilac]{--seg:#E7E6E1;--backdrop:#E7E6E1;--canvas:#E7E6E1;--panel:#F4F3EF;--bar:#EEEDE8;--border:#CECDC8;--text:#22231E;--text2:#55554F;--muted:#66665F;--ctl:#22231E;--ctl-fg:#F4F3EF;--float:#F4F3EF;--hover:#E7E6E1;--sel:#CEB4F5;--sel-fg:#22231E;--shipbg:#CEB4F5;--ship-fg:#22231E;--avatar:#E7E6E1;--avatar-fg:#22231E;--board:#FFFFFF;--boardline:#CECDC8;--ph:#E7E6E1;--swline:#CECDC8;--thumb:#EEEDE8;--thumbline:#CECDC8;--shadow:0 4px 16px rgba(34,35,30,.1);--sw-fill:#CEB4F5;--sw-a:#22231E}
[data-theme=paper]{--seg:#E7E6E1;--backdrop:#E7E6E1;--canvas:#E7E6E1;--panel:#F4F3EF;--bar:#EEEDE8;--border:#CECDC8;--text:#22231E;--text2:#55554F;--muted:#66665F;--ctl:#22231E;--ctl-fg:#F4F3EF;--float:#F4F3EF;--hover:#E7E6E1;--sel:#E7E6E1;--sel-fg:#22231E;--shipbg:#E7E6E1;--ship-fg:#22231E;--avatar:#E7E6E1;--avatar-fg:#22231E;--board:#FFFFFF;--boardline:#CECDC8;--ph:#E7E6E1;--swline:#CECDC8;--thumb:#EEEDE8;--thumbline:#CECDC8;--shadow:0 4px 16px rgba(34,35,30,.1);--sw-fill:#F4F3EF;--sw-a:#22231E}
[data-theme=graphite]{--seg:#42423B;--backdrop:#141411;--canvas:#1C1C18;--panel:#262621;--bar:#32322C;--border:#42423B;--text:#F4F3EF;--text2:#BDBCB3;--muted:#A09F96;--ctl:#F4F3EF;--ctl-fg:#22231E;--float:#32322C;--hover:#32322C;--sel:#32322C;--sel-fg:#F4F3EF;--shipbg:#32322C;--ship-fg:#F4F3EF;--avatar:#42423B;--avatar-fg:#F4F3EF;--sw-fill:#262621;--sw-a:#F4F3EF;--board:#32322C;--boardline:#42423B;--ph:#262621;--swline:#42423B;--thumb:#1C1C18;--thumbline:#42423B;--shadow:0 4px 16px rgba(0,0,0,.5)}
[data-theme=darkroom]{--seg:#34342C;--backdrop:#10100B;--canvas:#26261F;--panel:#16160F;--bar:#20201A;--border:#34342C;--text:#F4F3EF;--text2:#BDBCB3;--muted:#A09F96;--ctl:#F4F3EF;--ctl-fg:#22231E;--float:#16160F;--hover:#20201A;--sel:#2A2A23;--sel-fg:#F4F3EF;--shipbg:#2A2A23;--ship-fg:#F4F3EF;--avatar:#34342C;--avatar-fg:#F4F3EF;--sw-fill:#20201A;--sw-a:#F4F3EF;--board:#32322A;--boardline:#3E3E35;--ph:#26261F;--swline:#3E3E35;--thumb:#20201A;--thumbline:#34342C;--shadow:0 4px 16px rgba(0,0,0,.6)}
[data-theme=noir]{--seg:#292629;--backdrop:#050505;--canvas:#141214;--panel:#080808;--bar:#141214;--border:#292629;--text:#ECEBE5;--text2:#A3A3A3;--muted:#8F8F8F;--ctl:#ECEBE5;--ctl-fg:#080808;--float:#080808;--hover:#1C1A1C;--sel:#292629;--sel-fg:#ECEBE5;--shipbg:#CEB4F5;--ship-fg:#080808;--avatar:#292629;--avatar-fg:#ECEBE5;--sw-fill:#141214;--sw-a:#ECEBE5;--board:#1C1A1C;--boardline:#343034;--ph:#141214;--swline:#343034;--thumb:#141214;--thumbline:#292629;--shadow:0 4px 16px rgba(0,0,0,.7)}
.app{transition:none}
.top{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;height:52px;padding:0;background:var(--panel);border-bottom:1px solid var(--border);min-width:0;position:relative;z-index:2}
.tl{display:flex;align-items:center;gap:8px;min-width:0;justify-self:start;padding-left:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.logo{width:32px;height:32px;display:grid;place-items:center;color:var(--text)}
.logo svg{width:20px;height:20px}
.logo:hover svg{opacity:.7}
.logo svg{overflow:visible}.logo .tfl{fill:currentColor;stroke:none}.logo .tro{fill:none;stroke:currentColor;stroke-width:10;stroke-linejoin:round;opacity:0}
.logo.saving-on .tfl{animation:ll-trf 1.6s cubic-bezier(.65,0,.35,1) infinite alternate}
.logo.saving-on .tro{stroke-dasharray:100;animation:ll-tro 1.6s cubic-bezier(.65,0,.35,1) infinite alternate}
@keyframes ll-tro{0%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}
@keyframes ll-trf{0%,55%{opacity:0}85%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.logo.saving-on .tro{animation:none;opacity:0}.logo.saving-on .tfl{animation:ll-fade 2.8s ease-in-out infinite}}
.pinfo{display:flex;align-items:center;gap:16px;min-width:0;color:var(--text2)}
/* 1px divider: .tl gap (8px) + 4px margin = 12px each side */
.tdiv{width:1px;height:20px;margin:0 4px;flex:none;align-self:center;background:var(--border)}
.pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:500;color:var(--text)}
.pagebtn{display:flex;align-items:center;gap:4px;height:32px;padding:0;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap}
.pagebtn:hover{color:var(--text)}
.pagebtn svg{width:14px;height:14px}
.modes{display:flex;gap:2px;height:32px;padding:2px;align-self:center;border:1px solid var(--border);border-radius:var(--r-md)}
.mode{width:76px;height:26px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.mode:hover{color:var(--text)}
.tr{display:flex;align-items:center;gap:8px;min-width:0;justify-self:end;height:100%;padding-right:16px}
.themebtn{width:32px;height:32px;align-self:center;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.themebtn:hover{background:var(--seg);color:var(--text)}
.themebtn svg{width:16px;height:16px}
.ship{height:32px;padding:0 12px;border:0;border-radius:var(--r-md);display:flex;align-items:center;gap:8px;align-self:center;background:var(--shipbg);color:var(--ship-fg);font-size:13px;font-weight:500;white-space:nowrap}
.ship.ready{background:var(--ctl);color:var(--ctl-fg)}
.ship svg{width:14px;height:14px}
.shipc{font-size:13px;font-weight:500;color:var(--ship-fg);font-variant-numeric:tabular-nums}
.avs{display:flex;align-items:center;gap:2px;align-self:center;background:none;border:0;padding:0}
.av{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-md);background:var(--avatar);color:var(--avatar-fg);font:500 11px/1 var(--sans)}
.av.more{color:var(--muted)}

/* Menus and dropdowns (shared), appended to body so the header never clips them */
.menu{position:absolute;z-index:20;background:var(--float);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);min-width:200px;padding:4px 0;display:block;max-height:70vh;overflow:auto;overscroll-behavior:contain;transform-origin:left top}
.menu.wide{width:320px;min-width:0;padding:0}
.menu.users{width:240px;min-width:0;padding:4px 0}
.menu .ico:has(.tpv){width:28px}
.tpv{position:relative;display:block;width:28px;height:18px;flex:none;box-sizing:border-box;border-radius:3px;border:1px solid var(--border);overflow:hidden;background:linear-gradient(to right,var(--c) 60%,var(--p) 60%)}
.tpv::after{content:"";position:absolute;left:calc(30% - 5px);top:calc(50% - 2px);width:10px;height:4px;border-radius:1px;background:var(--k)}
.tpv.t-dark{--c:#1E1E1E;--p:#2C2C2C;--k:#FFFFFF}
.tpv.t-white{--c:#F5F5F5;--p:#FFFFFF;--k:#000000}
.tpv.t-warm{--c:#F3F0E9;--p:#FDFCF8;--k:#101010}
.tpv.t-lilac{--c:#E7E6E1;--p:#F4F3EF;--k:#CEB4F5}
.tpv.t-paper{--c:#E7E6E1;--p:#F4F3EF;--k:#22231E}
.tpv.t-graphite{--c:#1C1C18;--p:#262621;--k:#F4F3EF}
.tpv.t-darkroom{--c:#26261F;--p:#16160F;--k:#F4F3EF}
.tpv.t-noir{--c:#141214;--p:#080808;--k:#CEB4F5}
.urow{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 12px;text-align:left;color:var(--text)}
.menu [role=menuitem].urow{height:40px}
.uname{display:flex;flex-direction:column;min-width:0}
.uname b{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uname small{font-size:11px;color:var(--muted)}
.menu [role=menuitem]{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 12px;color:var(--text2);text-align:left;white-space:nowrap}
.menu [role=menuitem]:hover,.menu [role=menuitem].on{color:var(--text)}
.menu [role=menuitem]:disabled,.menu [role=menuitem]:disabled:hover{background:none;color:var(--muted);cursor:default;opacity:.45}
.menu.ctx{width:248px;min-width:0;padding:4px;border-radius:var(--r-lg)}
.menu.ctx [role=menuitem]{padding:0 12px;border-radius:var(--r-sm)}
#sub::after{content:"";position:absolute;top:0;bottom:0;left:-4px;width:4px}
#sub.flip::after{left:auto;right:-4px}
.menu .ico{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--muted)}
.menu .chv{margin-left:auto;color:var(--muted)}
.menu [role=menuitem] kbd{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.menu .grp{padding:8px 12px 4px;border-top:1px solid var(--border)}
.menu .grp:first-child{border-top:0}
.menu .hl{margin:4px 0}
.srow{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;color:var(--text)}
.srow+.srow{border-top:1px solid var(--border)}
.srow span{flex:1;min-width:0}
.srow.muted{color:var(--muted)}
.mini{height:24px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-weight:500;font-size:11px;flex:none}
.mini:hover{background:var(--panel)}
.pubrow{padding:8px 12px 12px}
.pubrow .btn{height:32px}

/* Shared motion. Open, close, the scroll bump and layout changes are driven by the spring engine (JS), the way Nook drives its island: each overlay is one surface whose size is physics. CSS holds rest states and the highlight. Reduced motion: a short opacity fade only. */
:is(.menu,.vpop,.ppop,.ins){visibility:hidden;pointer-events:none}
:is(.menu,.vpop,.ppop,.ins).open{visibility:visible;pointer-events:auto}
:is(.menu,.vpop,.ppop,.ins)[data-lv]{visibility:visible}
:is(.menu,.vpop,.ppop,.ins)[data-mv]{overflow:hidden!important;max-height:none!important;min-width:0!important}
.ll-lay{position:relative;isolation:isolate;display:flow-root}
.vpop>.ll-lay,.ppop>.ll-lay{display:flex;flex-direction:column;flex:none}
.ins>.ll-lay{display:flex;flex-direction:column;flex:1;min-height:0}
.ll-hl{position:absolute;left:0;top:0;z-index:-1;width:100%;height:32px;border-radius:var(--r-sm);background:var(--hover);transform-origin:50% 50%;opacity:0;pointer-events:none;will-change:transform;transition:opacity var(--ll-dur-fade) ease-out}
.ll-hl.show{opacity:1}
.menu:not(.ctx) .ll-hl,#vpop .ll-hl{border-radius:0}
.menu.kb .ll-hl{outline:2px solid var(--text);outline-offset:-2px}
.menu .chv{transition:rotate var(--ll-dur-pop) var(--ll-ease-pop)}
.menu [role=menuitem].subopen .chv{rotate:90deg}
.menu:focus{outline:none}
@media (prefers-reduced-motion:reduce){
  .menu .chv{transition:none}
}

/* Dropdown fields: the field is the seed of the list surface (same spring engine as the menus) */
.dnat{display:none}
.dfield.dd{position:relative;transition:scale var(--ll-dur-pop) var(--ll-ease-pop),border-color .12s}
.dfield.dd:has(.dd-f:active:not(:disabled)){scale:.97}
.dfield.dd::after{content:"";position:absolute;inset:-3px;border:2px solid var(--text);border-radius:calc(var(--r-sm) + 3px);opacity:0;scale:1.06;pointer-events:none;transition:opacity .12s ease-out,scale var(--ll-dur-pop) var(--ll-ease-pop)}
.dfield.dd:has(.dd-f:focus-visible)::after{opacity:1;scale:1}
.dd-f{all:unset;box-sizing:border-box;flex:1;min-width:0;height:100%;display:flex;align-items:center;font:400 11px var(--mono);color:var(--text);cursor:pointer;white-space:nowrap}
.dd-f:disabled{cursor:default}
.dd-f .ddt{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;transform-origin:0 50%}
.dfield.dd .dchev{transition:translate var(--ll-dur-pop) var(--ll-ease-pop),rotate var(--ll-dur-pop) var(--ll-ease-pop)}
.dfield.dd:not(.dis):hover .dchev{translate:0 1.5px}
.dfield.dd.open .dchev,.dfield.dd.open:hover .dchev{rotate:180deg;translate:0 0}
.dfield.dd.dis{opacity:.45}
.dfield.dd.dis,.dfield.dd.dis .dchev{transition:none}
.dfield.mixed .ddt{color:var(--muted)}
@keyframes ddshim{from{background-position:-120% 0}to{background-position:240% 0}}
.dfield.mixed:not(.dis){background-image:linear-gradient(100deg,transparent 30%,var(--hover) 50%,transparent 70%);background-repeat:no-repeat;background-size:60% 100%;animation:ddshim .9s ease-out 1 both}
.pagebtn,.lbl{outline:2px solid transparent;outline-offset:2px;transition:scale var(--ll-dur-pop) var(--ll-ease-pop),outline-color .12s,outline-offset var(--ll-dur-pop) var(--ll-ease-pop)}
.pagebtn:focus-visible,.lbl:focus-visible{outline-color:var(--text);outline-offset:-2px}
.pagebtn:active,.lbl:active{scale:.97}
.pagebtn svg,.lbl svg{transition:translate var(--ll-dur-pop) var(--ll-ease-pop),rotate var(--ll-dur-pop) var(--ll-ease-pop)}
.pagebtn:hover svg,.lbl:hover svg{translate:0 1.5px}
.pagebtn[aria-expanded=true] svg,.lbl[aria-expanded=true] svg{rotate:180deg;translate:0 0}
.menu.dd{z-index:80;padding:0;min-width:0;max-height:none;overflow:hidden}
.dd-s{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-bottom:1px solid var(--border);color:var(--muted)}
.dd-s input{all:unset;flex:1;min-width:0;font:400 12px var(--sans);color:var(--text)}
.dd-s input::placeholder{color:var(--muted)}
.ddl{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
.ddl:focus{outline:none}
.ddi{position:relative;isolation:isolate;padding:4px}
.menu.dd .ddi .ll-hl{border-radius:var(--r-sm)}
.dd-o{display:block;height:28px;cursor:pointer;color:var(--text2)}
.dd-o.on,.dd-o.cur{color:var(--text)}
.dd-i{display:flex;align-items:center;gap:8px;height:100%;padding:0 12px 0 32px;font:400 12px var(--sans);white-space:nowrap;transform-origin:20% 50%}
.dd-a .dd-i{padding-left:12px}
.dd-h{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.dd-sep{height:1px;margin:4px -4px;background:var(--border)}
.dd-ck,.dd-gh{position:absolute;left:12px;top:0;width:14px;height:14px;pointer-events:none;color:var(--text)}
.dd-ck svg,.dd-gh svg{width:14px;height:14px}
.dd-ck{opacity:0}
.dd-gh{opacity:0;transition:opacity .12s ease-out,translate .1s ease-out}
.dd-none{display:flex;align-items:center;justify-content:center;height:56px;color:var(--muted);font:400 12px var(--sans)}
.dd-rm{position:absolute;pointer-events:none}
.gone{display:none!important}
@media (prefers-reduced-motion:reduce){
  .dfield.dd,.dfield.dd::after,.dfield.dd .dchev,.pagebtn,.lbl,.pagebtn svg,.lbl svg,.dd-gh{transition:none}
  .dfield.mixed{animation:none;background-image:none}
}

/* ===== PANELS ===== */
.left{grid-column:1;grid-row:2/4;height:calc(100% - var(--bh)*var(--fw));position:relative;border-right:1px solid var(--border);overflow:visible}
.right{grid-column:3;grid-row:2/4;height:calc(100% - var(--bh)*var(--fw));position:relative;border-left:1px solid var(--border);overflow:visible}
/* Copied from the editor prototype: PANELS (left panel header, search field, rows) */
.zone{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.zhead{height:44px;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;border-bottom:1px solid var(--border);flex:none}
.zbody{flex:1;overflow:auto;min-height:0}
.lh{font-weight:500}
#lsearchbtn[aria-pressed=true]{background:var(--bar);color:var(--text)}
.lsbox{flex:none;padding:12px;border-bottom:1px solid var(--border)}
.lsfield{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--muted)}
.lsfield:focus-within{border-color:var(--text)}
.lsfield input{all:unset;flex:1;min-width:0;font:400 13px var(--sans);color:var(--text)}
.lsfield input::placeholder{color:var(--muted)}
.lsclear{width:20px;height:20px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--muted);font:400 16px/1 var(--sans)}
.lsclear:hover{background:var(--panel);color:var(--text)}
.lscount{margin-top:8px;font-size:11px;color:var(--muted)}
.lsnone{padding:16px;color:var(--muted)}
.hit{color:var(--text);font-weight:600}
.row{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 calc(16px + var(--lvl,0) * 16px);color:var(--text2);width:100%;text-align:left;white-space:nowrap}
.row:hover{background:var(--canvas);color:var(--text)}
.row[aria-selected=true]{background:var(--sel);color:var(--sel-fg)}
.row>svg{color:var(--muted)}
.row[aria-selected=true]>svg{color:var(--sel-fg)}
.row .c{width:12px;height:12px}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .act{color:var(--muted);opacity:0;display:flex;gap:2px}
.row:hover .act{opacity:1}
.mh{padding:8px 12px 4px;font-size:11px;font-weight:500;color:var(--muted);cursor:default;user-select:none}
.app.pfx .left,.app.pfx .right{visibility:visible!important;overflow:hidden}
.app.pfx .top{z-index:4}
/* Home, part 1: two columns (no inspector); the top bar keeps the editor's three-part grid */
.app{--rw:0px;grid-template-columns:var(--lw) minmax(0,1fr);grid-template-rows:52px minmax(0,1fr)}
.tr{grid-column:3}
.row .cnt{font:400 11px var(--mono);color:var(--muted)}
.row[aria-selected=true] .cnt{color:var(--sel-fg)}
.row.ghost{color:var(--muted)}
.row.acct{height:44px;padding:0 8px 0 16px}
.zfoot{flex:none;border-top:1px solid var(--border)}
.zbody .micro{padding:16px 16px 4px;display:block}
.hmain{display:grid;place-items:center;color:var(--muted);font:400 13px var(--sans)}
</style>
</head>

    s.shapeTo(s.size,m.r);s.Y.to=0;s.G.to=0;
    s.paint();
    s.settleOrRun();
    swapIn(s.lay,dir);
  }
  function closeSub(){clearTimeout(subT);inSub=false;if(sbm.anchor)sbm.anchor.classList.remove('subopen');sbm.anchor=null;sbm.sf.leave()}
  function popRow(t){if(!reduced())springAnim(t,[{scale:'1.12'},{scale:'1'}],.2,.4)}
  function wiggle(row){
    var p=mo(),ic=$('.ico',row);
    if(reduced()||!p.wiggle||!ic)return;
    springAnim(ic,[{rotate:([].indexOf.call(row.parentNode.children,row)&1?-1:1)*p.wiggle+'deg'},{rotate:'0deg'}],.26,.35);
  }
  function pick(root,t){var it=root.items[+t.dataset.n];closeAll();popRow(t);if(it.f)it.f()}
  function mark(list,i){clearTimeout(subT);list.forEach(function(x){x.classList.remove('on')});if(list[i]){list[i].classList.add('on');var r=list[i].closest('.menu');r.classList.add('kb');hlMove(r,list[i]);wiggle(list[i])}}
  /* Keyboard: arrows move the highlight (on a parent row with its submenu open the submenu follows), Right enters a submenu, Left leaves it, Enter acts */
  function keyNav(e){
    var sub=sbm.classList.contains('open'),list=$$('[role=menuitem]:not(:disabled)',sub&&inSub?sbm:mm),i=-1,cur,go;
    list.forEach(function(x,j){if(x.classList.contains('on'))i=j});
    cur=list[i];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      if(!list.length)return false;
      go=e.key==='ArrowDown'?(i+1)%list.length:(i<=0?list.length-1:i-1);
      mark(list,go);
      if(sub&&!inSub){if(list[go].dataset.sub)openSub(list[go]);else closeSub()}
    }
    else if(e.key==='ArrowLeft'&&sub)closeSub();
    else if((e.key==='ArrowRight'||e.key==='Enter')&&cur&&cur.dataset.sub&&!inSub){openSub(cur);inSub=true;mark($$('[role=menuitem]:not(:disabled)',sbm),0)}
    else if(e.key==='Enter'&&cur)cur.click();
    else return false;
    e.preventDefault();return true;
  }
  function hoverRow(root,t){
    clearTimeout(subT);
    if(!t.classList.contains('on'))wiggle(t);
    $$('.on',root).forEach(function(x){x.classList.remove('on')});
    t.classList.add('on');root.classList.remove('kb');hlMove(root,t);
    if(root===mm||root===sbm)inSub=root===sbm;
    if(root===mm)subT=setTimeout(t.dataset.sub?function(){openSub(t)}:closeSub,t.dataset.sub?(sbm.classList.contains('open')?60:80):200);
  }
  [mm,sbm,vp].forEach(function(root){
    root.addEventListener('mouseover',function(e){
      var t=e.target.closest(ROW);if(!t||t.disabled)return;
      if(root===mm&&sbm.classList.contains('open')&&t!==sbm.anchor&&inTri()){
        clearTimeout(subT);subT=setTimeout(function(){if(t.matches(':hover')&&!sbm.matches(':hover'))hoverRow(root,t)},100);return;
      }
      hoverRow(root,t);
    });
    root.addEventListener('focusin',function(e){var t=e.target.closest(ROW);if(t&&root.contains(t))hlMove(root,t)});
    root.addEventListener('mouseleave',function(){if(root===mm&&sbm.classList.contains('open'))return;hlHide(root)});
  });
  sbm.addEventListener('mouseenter',function(){clearTimeout(subT)});
  sbm.addEventListener('click',function(e){e.stopPropagation();var t=e.target.closest('[role=menuitem]');if(t&&!t.disabled)pick(sbm,t)});
  /* Copied from the editor prototype: shared spring panel transition (panelFx) */
  /* Shared spring panel transition. --lw, --rw, --bh and --fw (0 normal, 1 full-width timeline) are springs while a change plays. Every panel collapse, mode switch and the full-width toggle goes through panelFx, so they all retarget the same springs (position and velocity are kept when a new change arrives mid-flight). */
  var PFX={lw:null,rw:null,bh:null,fw:null,on:false,done:null,sim:null};
  function appVals(){
    var cs=getComputedStyle(app),c=cs.gridTemplateColumns.split(' ').map(parseFloat),r=cs.gridTemplateRows.split(' ').map(parseFloat);
    return {lw:c[0]||0,rw:c[2]||0,bh:r[2]||0,fw:parseFloat(cs.getPropertyValue('--fw'))||0};
  }
  function pfxClear(){['--lw','--rw','--bh','--fw'].forEach(function(p){app.style.removeProperty(p)})}
  function pfxApply(){
    if(!PFX.on)return;
    app.style.setProperty('--lw',Math.max(0,PFX.lw.x).toFixed(2)+'px');
    app.style.setProperty('--rw',Math.max(0,PFX.rw.x).toFixed(2)+'px');
    app.style.setProperty('--bh',Math.max(0,PFX.bh.x).toFixed(2)+'px');
    app.style.setProperty('--fw',PFX.fw.x.toFixed(4));
  }
  function pfxEnd(){
    var d;
    if(!PFX.on)return;
    PFX.on=false;pfxClear();app.classList.remove('pfx');
    d=PFX.done;PFX.done=null;if(d)d();
  }
  function panelFx(change,done,spec){
    var live=PFX.on,a,b,s;
    if(!PFX.lw){
      PFX.lw=new Spring(0,[.4,.6]);PFX.rw=new Spring(0,[.4,.6]);PFX.bh=new Spring(0,[.4,.6]);PFX.fw=new Spring(0,[.4,.6]);
      PFX.sim={sp:[PFX.lw,PFX.rw,PFX.bh,PFX.fw],apply:pfxApply,rest:pfxEnd};
    }
    if(live){a={lw:PFX.lw.x,rw:PFX.rw.x,bh:PFX.bh.x,fw:PFX.fw.x};pfxClear()}
    else a=appVals();
    change();
    b=appVals();
    if(reduced()||(!live&&Math.abs(a.lw-b.lw)+Math.abs(a.rw-b.rw)+Math.abs(a.bh-b.bh)+Math.abs(a.fw-b.fw)<.5)){
      if(live){PFX.on=false;app.classList.remove('pfx');s=PFX.done;PFX.done=null;if(s)s()}
      if(done)done();
      return;
    }
    s=spec||mo().shape;
    [PFX.lw,PFX.rw,PFX.bh,PFX.fw].forEach(function(q){q.tune(s)});
    if(!live){
      PFX.lw.x=a.lw;PFX.rw.x=a.rw;PFX.bh.x=a.bh;PFX.fw.x=a.fw;
      [PFX.lw,PFX.rw,PFX.bh,PFX.fw].forEach(function(q){q.v=0});
    }
    PFX.lw.to=b.lw;PFX.rw.to=b.rw;PFX.bh.to=b.bh;PFX.fw.to=b.fw;
    if(done){if(PFX.done){var p=PFX.done;PFX.done=function(){p();done()}}else PFX.done=done}
    PFX.on=true;app.classList.add('pfx');pfxApply();simAdd(PFX.sim);
  }
  /* ===== Home: sidebar behaviour ===== */
  /* Copied from the editor prototype: the workspace switch uses the dropdown system (as #pagebtn does there) */
  var SPACES=['Personal','Magnm Studio','Lazy Layout Team'];
  function cfgOf(a){
    return {anchor:a,label:'Workspaces',ph:'Search workspaces',minW:200,labelEl:$('#pagelabel'),items:SPACES.map(function(p){return {v:p,t:p}}),
      get value(){return $('#pagelabel').textContent},apply:function(v){$('#pagelabel').textContent=v},
      acts:[{t:'+ New workspace',fn:function(){}}]};
  }
  $('#pagebtn').addEventListener('click',function(){ddOpen(cfgOf(this),false)});

  /* Account menu: the editor's playful openMenu */
  function acctGroups(){return [
    [{l:'Settings',k:'Ctrl+,',ic:'gear'},{l:'Storage',k:'6.2 of 10 GB',ic:'db'}],
    [{l:'Help',ic:'info'}],
    [{l:'Sign out',ic:'exp'}]
  ]}
  $('#acctrow').addEventListener('click',function(){openMenu(this,'',{kind:'acct',cls:'ctx',up:true,groups:acctGroups()})});
  $('#avtop').addEventListener('click',function(){openMenu(this,'',{kind:'acct',cls:'ctx',right:true,groups:acctGroups()})});
  mm.addEventListener('click',function(e){e.stopPropagation();var t=e.target.closest('[role=menuitem]');if(t&&!t.disabled)pick(mm,t)});

  /* Theme button: Warm and Darkroom, same logic as the editor */
  function syncTheme(){
    var t=curTheme(),toNoir=LIGHT.indexOf(t)>-1,n=toNoir?'Darkroom':'Warm',b=$('#themebtn');
    b.setAttribute('aria-label','Switch to '+n);b.title='Switch to '+n;
    b.querySelector('use').setAttribute('href',toNoir?'#moon':'#sun');
  }
  function setTheme(t){
    app.style.transition='opacity 150ms ease';app.style.opacity='0.85';
    document.documentElement.dataset.theme=t;
    syncTheme();
    try{localStorage.setItem('ll-theme-v2',t)}catch(e){}
    setTimeout(function(){app.style.opacity='1'},150);
    setTimeout(function(){app.style.transition='';app.style.opacity=''},320);
  }
  syncTheme();
  $('#themebtn').addEventListener('click',function(){closeAll();setTheme(LIGHT.indexOf(curTheme())>-1?'darkroom':'warm')});

  /* Rows: selection highlight, folder expand and collapse */
  var nav=$('#p-nav');
  function select(k){$$('.row[data-sel]',nav).forEach(function(r){r.setAttribute('aria-selected',String(r.dataset.sel===k))})}
  function toggleFolder(row){
    var open=row.getAttribute('aria-expanded')!=='true',ch=row.querySelector('.c'),k=row.dataset.sel;
    row.setAttribute('aria-expanded',String(open));
    ch.style.transform=open?'rotate(90deg)':'';
    if(!reduced())springAnim(ch,[{transform:open?'rotate(0deg)':'rotate(90deg)'},{transform:open?'rotate(90deg)':'rotate(0deg)'}],.3,.6);
    $$('.row[data-par="'+k+'"]',nav).forEach(function(r){r.classList.toggle('hide',!open)});
  }
  nav.addEventListener('click',function(e){
    var r=e.target.closest('.row[data-sel]');if(!r)return;
    select(r.dataset.sel);
    if(r.hasAttribute('aria-expanded')&&e.target.closest('.c'))toggleFolder(r);
  });
  nav.addEventListener('keydown',function(e){
    var r=e.target.closest('.row[data-sel][aria-expanded]');if(!r)return;
    if((e.key==='ArrowRight'&&r.getAttribute('aria-expanded')!=='true')||(e.key==='ArrowLeft'&&r.getAttribute('aria-expanded')==='true')){e.preventDefault();toggleFolder(r)}
  });

  /* Search: the icon shows or hides the field, typing filters the rows */
  var lsIn=$('#lsearch'),lsBox=$('#lfilter'),lsBtn=$('#lsearchbtn'),lsClr=$('#lsclear');
  function lsFilter(){
    var q=lsIn.value.trim().toLowerCase();
    $$('.row[data-sel]',nav).forEach(function(r){
      var nm=r.querySelector('.nm'),t=nm.dataset.t||(nm.dataset.t=nm.textContent),at=q?t.toLowerCase().indexOf(q):-1;
      nm.innerHTML=at<0?t:t.slice(0,at)+'<span class="hit">'+t.slice(at,at+q.length)+'</span>'+t.slice(at+q.length);
      r.classList.toggle('gone',!!q&&at<0);
    });
    lsClr.classList.toggle('hide',!lsIn.value);
  }
  lsIn.addEventListener('input',lsFilter);
  lsClr.addEventListener('click',function(){lsIn.value='';lsFilter();lsIn.focus()});
  lsBtn.addEventListener('click',function(){
    var off=lsBox.classList.toggle('hide');
    lsBtn.setAttribute('aria-pressed',String(!off));
    if(!off)lsIn.focus();else{lsIn.value='';lsFilter()}
  });

  /* Document handlers copied from the editor: outside click closes menus, Escape, menu keys, Ctrl+\ collapses the sidebar with the shared spring */
  document.addEventListener('click',function(e){if(e.target.closest('.menu,.vpop,.ins,.aibox,.ppop,[aria-haspopup]'))return;closeAll()});
  function togglePanel(cls,collapse){
    panelFx(function(){app.classList.toggle(cls,collapse)});
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){if(sbm.classList.contains('open')&&mm.classList.contains('open')){e.preventDefault();closeSub();return}closeAll();return}
    if(mm.classList.contains('open')&&!/INPUT/.test(document.activeElement.tagName)&&keyNav(e))return;
    if(e.ctrlKey&&e.key==='\\'){e.preventDefault();togglePanel('lc',!app.classList.contains('lc'))}
  });

})();
</script>
