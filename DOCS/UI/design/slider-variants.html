<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazy Layout Sliders</title>
<script>try{var s=JSON.parse(localStorage.getItem('ll-slider-variants')||'{}');document.documentElement.dataset.theme=s.theme==='noir'?'noir':'paper'}catch(e){document.documentElement.dataset.theme='paper'}</script>
<style>
/* Slider variants for the right panel. Paper and Noir from PALETTE.md. No pills, no glass. */
:root{--sans:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;--r-sm:4px;--r-md:6px;--r-lg:8px}
[data-theme=paper]{--canvas:#E7E6E1;--panel:#F4F3EF;--bar:#EEEDE8;--border:#CECDC8;--text:#22231E;--text2:#55554F;--muted:#66665F;--hover:#E7E6E1;--fill:#D6D5CF;--ctl:#22231E;--ctl-fg:#F4F3EF;--shadow:0 4px 16px rgba(34,35,30,.1);--thumb:#FFFFFF}
[data-theme=noir]{--canvas:#141214;--panel:#080808;--bar:#141214;--border:#292629;--text:#ECEBE5;--text2:#A3A3A3;--muted:#8F8F8F;--hover:#1C1A1C;--fill:#2E2B2E;--ctl:#ECEBE5;--ctl-fg:#080808;--shadow:0 4px 16px rgba(0,0,0,.7);--thumb:#ECEBE5}
*{box-sizing:border-box;margin:0}
body{background:var(--canvas);color:var(--text);font:13px/1.4 var(--sans);-webkit-font-smoothing:antialiased;padding:24px 16px 64px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.mono{font-family:var(--mono)}
.micro{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto}
h1{font-size:20px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--text2);margin-top:4px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.btn{height:32px;padding:0 12px;border-radius:var(--r-md);font-weight:500;border:1px solid var(--border);color:var(--text);background:var(--panel);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--ctl);color:var(--ctl-fg);border-color:var(--ctl)}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--panel)}
.seg button{height:26px;padding:0 12px;border-radius:var(--r-sm);font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--canvas);color:var(--text)}
[data-theme=noir] .seg button[aria-pressed=true]{background:var(--border)}
.tune{margin-top:20px;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px 24px;align-items:end}
.tune label{display:flex;flex-direction:column;gap:6px}
.tune .row{display:flex;justify-content:space-between}
.tune output{font:500 12px var(--mono);color:var(--text)}
.tune input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;touch-action:pan-y}
.tune input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--border);border-radius:2px}
.tune input[type=range]::-moz-range-track{height:4px;background:var(--border);border-radius:2px}
.tune input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:18px;margin-top:-7px;border-radius:3px;background:var(--thumb);border:1px solid var(--text)}
.tune input[type=range]::-moz-range-thumb{width:8px;height:16px;border-radius:3px;background:var(--thumb);border:1px solid var(--text)}
.copyrow{grid-column:1/-1;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.copyrow textarea{flex:1;min-width:220px;height:84px;resize:none;background:var(--canvas);color:var(--text);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px;font:12px/1.4 var(--mono)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px;margin-top:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.chosen{border-color:var(--text);box-shadow:var(--shadow)}
.card header{display:flex;gap:10px;align-items:baseline}
.card h2{font-size:15px;font-weight:600;letter-spacing:-.01em}
.card .num{font:500 11px var(--mono);color:var(--muted)}
.best{color:var(--text2)}
.sim{width:320px;max-width:100%;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bar);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.demo{border:1px dashed var(--border);border-radius:var(--r-md);background:var(--canvas);padding:20px;display:flex;flex-direction:column;gap:14px}
.card footer{display:flex;justify-content:flex-end;margin-top:auto}
.host{--fh:30px;--tk:4px;--tw:10px;--th:18px;min-width:0;display:flex;flex-direction:column;gap:8px}
.host.big{--fh:44px;--tk:6px;--tw:14px;--th:28px;font-size:15px}
.big .lbl{font-size:14px}

/* shared parts */
.lbl{color:var(--text2);flex:none;width:64px}
.val{font:500 12px var(--mono);color:var(--text)}
.big .val{font-size:14px}
.valbox{display:flex;align-items:center;justify-content:flex-end;gap:2px;flex:none;width:56px;height:var(--fh);padding:0 8px;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-sm)}
.valbox:hover{border-color:var(--muted)}
.valbox:focus-within{border-color:var(--text)}
.valbox input{all:unset;min-width:0;width:100%;text-align:right;font:500 12px var(--mono);color:var(--text)}
.big .valbox input{font-size:14px}
.valbox .u{font:400 11px var(--mono);color:var(--muted)}
.cl{display:flex;align-items:center;gap:12px;min-width:0}
.hit{position:relative;flex:1;min-width:0;height:var(--fh);touch-action:pan-y;cursor:pointer;user-select:none;-webkit-user-select:none}
.hit:focus-visible{outline:none}
.hit:focus-visible .thumb{outline:2px solid var(--text);outline-offset:2px}
.trk{position:absolute;left:0;right:0;top:50%;height:var(--tk);margin-top:calc(var(--tk) / -2);background:var(--border);border-radius:2px;overflow:hidden}
.fillbar{position:absolute;left:0;top:0;bottom:0;width:calc(var(--tw) / 2 + (100% - var(--tw)) * var(--x));background:var(--text)}
.thumb{position:absolute;top:50%;width:var(--tw);height:var(--th);left:calc(var(--tw) / 2 + (100% - var(--tw)) * var(--x));transform:translate(-50%,-50%);background:var(--thumb);border:1px solid var(--text);border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.hit.drag{cursor:grabbing}
.tick{position:absolute;top:calc(50% + var(--th) / 2 + 2px);left:calc(var(--tw) / 2 + (100% - var(--tw)) * var(--p));width:1px;height:6px;margin-left:-.5px;background:var(--muted);transform-origin:top}
.cl.has-ticks{padding-bottom:12px}
.cl.color .trk{height:14px;margin-top:-7px;border:1px solid var(--border);border-radius:3px;background-clip:padding-box}
.big .cl.color .trk{height:20px;margin-top:-10px}
.cl.color .fillbar{display:none}
.cl.color .thumb{width:8px;height:calc(var(--th) + 4px);background:hsl(var(--hue) 80% 50%)}
.cl.color.alpha .thumb{background:linear-gradient(hsl(var(--hue) 80% 50% / var(--al)),hsl(var(--hue) 80% 50% / var(--al))),conic-gradient(#bbb 25%,#fff 0 50%,#bbb 0 75%,#fff 0) 0 0/6px 6px}
.cmp{gap:8px}
.cmp .trk{height:2px;margin-top:-1px}
.cmp .thumb{width:6px;height:12px}
.cmp .val{width:34px;text-align:right;opacity:0;transition:opacity .12s;flex:none}
.pr{display:flex;align-items:center;gap:8px;min-height:var(--fh);padding:0 8px;border-radius:var(--r-sm);margin:0 -8px}
.pr>.cl{flex:1}
.valbox{white-space:nowrap;min-width:56px;width:auto}
.pr:hover{background:var(--hover)}
.pr:hover .val,.pr:focus-within .val,.pr .cmp.show .val{opacity:1}
.pr>.lbl{width:56px}

/* fill field */
.ff{position:relative;height:var(--fh);display:flex;align-items:center;justify-content:space-between;padding:0 10px;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none;border-radius:var(--r-sm)}
.ffbg{position:absolute;inset:0;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;transform-origin:left center;pointer-events:none}
.ff:hover .ffbg{border-color:var(--muted)}
.ff:focus-visible .ffbg{border-color:var(--text)}
.fffill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--x) * 100%);background:var(--fill)}
.fftxt{position:relative;color:var(--text2);pointer-events:none}
.ff .val,.ff .ffin{position:relative}
.ffin{all:unset;position:relative;width:56px;text-align:right;font:500 12px var(--mono);color:var(--text);cursor:text}
.big .ffin{font-size:14px}
.ff.edit{cursor:text}
.ff.drag{cursor:grabbing}

/* scrub */
.sfs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sf{display:flex;align-items:center;gap:8px;height:var(--fh);padding:0 10px;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-sm);min-width:0}
.sf:hover{border-color:var(--muted)}.sf:focus-within{border-color:var(--text)}
.sflab{flex:none;width:18px;height:100%;display:flex;align-items:center;font:500 11px var(--mono);color:var(--muted);cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sflab:hover{color:var(--text)}
.sflab:focus-visible{outline-offset:-2px}
.sf input{all:unset;flex:1;min-width:0;font:500 13px var(--mono);color:var(--text)}
.big .sf input{font-size:15px}
.sf .u{font:400 11px var(--mono);color:var(--muted)}

/* range */
.rg .thumb{touch-action:pan-y;cursor:grab}
.rg .thumb:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.rg .fillbar{left:calc(var(--tw) / 2 + (100% - var(--tw)) * var(--lo));width:calc((100% - var(--tw)) * (var(--hi) - var(--lo)))}
.rg .t1{left:calc(var(--tw) / 2 + (100% - var(--tw)) * var(--lo))}
.rg .t2{left:calc(var(--tw) / 2 + (100% - var(--tw)) * var(--hi))}

/* dial */
.dialrow{display:flex;align-items:center;gap:16px}
.dial{--d:56px;position:relative;width:var(--d);height:var(--d);flex:none;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--canvas);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.big .dial{--d:96px}
.dial.drag{cursor:grabbing}
.dial:hover{border-color:var(--muted)}
.dial .ind{position:absolute;left:50%;top:5px;width:2px;height:calc(50% - 5px);margin-left:-1px;background:var(--text);transform-origin:50% 100%;pointer-events:none}
.dial .ind::before{content:"";position:absolute;left:-2px;top:-1px;width:6px;height:6px;background:var(--text);border-radius:1px}
.dial .hub{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:var(--thumb);border:1px solid var(--text);border-radius:1px}
.dial i{position:absolute;background:var(--border);pointer-events:none}
.dial .c1{left:50%;top:-1px;width:1px;height:4px}.dial .c2{right:-1px;top:50%;width:4px;height:1px}.dial .c3{left:50%;bottom:-1px;width:1px;height:4px}.dial .c4{left:-1px;top:50%;width:4px;height:1px}

.swatch{width:44px;height:var(--fh);flex:none;border:1px solid var(--border);border-radius:var(--r-sm);background:conic-gradient(#bbb 25%,#fff 0 50%,#bbb 0 75%,#fff 0) 0 0/8px 8px;position:relative;overflow:hidden}
.swatch::after{content:"";position:absolute;inset:0;background:hsl(var(--hue) 80% 50% / var(--al))}
.colors{display:flex;flex-direction:column;gap:8px}
.cr{display:flex;align-items:center;gap:12px}
.cr .cl{flex:1}

@media (prefers-reduced-motion:reduce){.cmp .val{transition:none}}
@media (max-width:480px){.sim{padding:12px}.lbl{width:52px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Slider variants</h1>
      <p class="sub">Ten styles for the Lazy Layout right panel. Each card has the real-size control and a larger demo. Drag, use arrow keys (Shift = x10, Home, End), double-click to reset.</p>
    </div>
    <div class="seg" role="group" aria-label="Theme"><button type="button" data-th="paper" aria-pressed="true">Paper</button><button type="button" data-th="noir" aria-pressed="false">Noir</button></div>
  </div>

  <section class="tune" aria-label="Tuning">
    <label><span class="row"><span class="micro">Spring response</span><output id="o-response"></output></span><input type="range" id="i-response" min="0.1" max="1.2" step="0.01" aria-label="Spring response"></label>
    <label><span class="row"><span class="micro">Spring damping</span><output id="o-damping"></output></span><input type="range" id="i-damping" min="0.2" max="1.2" step="0.01" aria-label="Spring damping"></label>
    <label><span class="row"><span class="micro">Rubber-band resistance</span><output id="o-rubber"></output></span><input type="range" id="i-rubber" min="0" max="0.95" step="0.01" aria-label="Rubber-band resistance"></label>
    <label><span class="row"><span class="micro">Step count</span><output id="o-steps"></output></span><input type="range" id="i-steps" min="2" max="20" step="1" aria-label="Step count"></label>
    <div class="copyrow">
      <button type="button" class="btn pri" id="copy">Copy values</button>
      <textarea id="out" readonly aria-label="Copied values"></textarea>
    </div>
  </section>

  <div class="grid" id="grid"></div>
</div>

<script>
"use strict";
/* ---- Spring and springEase, copied from src/editor/motion/spring.ts and ease.ts ---- */
const DEFAULT_REST={x:0.01,v:0.05};
class Spring{
  constructor(x,spec,rest=DEFAULT_REST){this.x=x;this.v=0;this.to=x;this.rest=rest;this.k=0;this.c=0;this.tune(spec)}
  tune(spec){const r=Array.isArray(spec)?spec[0]:spec.response;const d=Array.isArray(spec)?spec[1]:spec.damping;this.k=((2*Math.PI)/r)**2;this.c=(4*Math.PI*d)/r}
  step(dt){const a=-this.k*(this.x-this.to)-this.c*this.v;this.v+=a*dt;this.x+=this.v*dt}
  get atRest(){return Math.abs(this.x-this.to)<this.rest.x&&Math.abs(this.v)<this.rest.v}
  snap(){this.x=this.to;this.v=0}
  jump(to){this.to=to;this.snap()}
}
function stepAll(springs,dt,substeps){const h=dt/substeps;for(let i=0;i<substeps;i++)for(let j=0;j<springs.length;j++)springs[j].step(h)}
const EASES=new Map();
function springEase(response,ratio){
  const key=response+"/"+ratio;const cached=EASES.get(key);if(cached)return cached;
  const k=((2*Math.PI)/response)**2,c=(4*Math.PI*ratio)/response;
  let x=0,v=0;const to=1;const pts=[0];const dt=1/600;let t=0,next=1/60;
  while(t<2){const a=-k*(x-to)-c*v;v+=a*dt;x+=v*dt;t+=dt;
    if(t>=next){pts.push(Number(x.toFixed(4)));next+=1/60;if(Math.abs(x-to)<0.01&&Math.abs(v)<0.05)break}}
  pts[pts.length-1]=1;
  const res={easing:"linear("+pts.join(", ")+")",duration:Math.round(((pts.length-1)/60)*1000)};
  EASES.set(key,res);return res;
}

/* ---- state ---- */
const KEY="ll-slider-variants";
const S={response:0.38,damping:0.78,rubber:0.6,steps:10,picked:null,theme:"paper"};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const mq=window.matchMedia("(prefers-reduced-motion: reduce)");
let RM=mq.matches;mq.addEventListener&&mq.addEventListener("change",e=>{RM=e.matches});

/* ---- single rAF loop, sleeps at rest ---- */
const REST={x:0.0004,v:0.01};
const active=new Set();let raf=0,last=0;
function spec(o){return{response:S.response*(o.mul||1),damping:o.elastic?Math.min(S.damping,0.55):S.damping}}
function mk(x,cb,o={}){const s=new Spring(x,spec(o),REST);s.cb=cb;s.o=o;return s}
function go(s,to){
  if(RM){s.jump(to);active.delete(s);s.cb();return}
  s.tune(spec(s.o));s.to=to;
  if(s.atRest){s.snap();active.delete(s);s.cb()}else{active.add(s);wake()}
}
function put(s,x){s.x=x;s.to=x;s.v=0;active.delete(s);s.cb()}
function wake(){if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}
function tick(now){
  raf=0;const dt=Math.min(0.033,(now-last)/1000||1/60);last=now;
  const arr=Array.from(active);stepAll(arr,dt,4);
  for(const s of arr){s.cb();if(s.atRest){s.snap();s.cb();active.delete(s)}}
  if(active.size)raf=requestAnimationFrame(tick);
}

/* ---- helpers ---- */
const $=(s,r=document)=>r.querySelector(s);
const h=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const snapTo=(v,min,max,step)=>clamp(+(Math.round((v-min)/step)*step+min).toFixed(4),min,max);
function aria(el,label,min,max){el.setAttribute("role","slider");el.tabIndex=0;el.setAttribute("aria-label",label);el.setAttribute("aria-valuemin",min);el.setAttribute("aria-valuemax",max)}
function keys(el,o){
  el.addEventListener("keydown",e=>{
    if(e.target!==el)return;
    const v=o.get(),s=e.shiftKey?o.step*10:o.step;let n=null;
    switch(e.key){
      case"ArrowRight":case"ArrowUp":n=v+s;break;
      case"ArrowLeft":case"ArrowDown":n=v-s;break;
      case"PageUp":n=v+o.step*10;break;case"PageDown":n=v-o.step*10;break;
      case"Home":n=o.min;break;case"End":n=o.max;break;
      case"Enter":if(o.edit){e.preventDefault();o.edit()}return;
      default:return}
    e.preventDefault();o.set(n);
  });
  el.addEventListener("dblclick",e=>{if(e.target===el||el.contains(e.target)&&!(e.target instanceof HTMLInputElement))o.set(o.def)});
}
function drag(el,o){
  el.addEventListener("pointerdown",e=>{
    if(e.button!==0||(o.filter&&!o.filter(e)))return;
    try{el.setPointerCapture(e.pointerId)}catch(x){}
    const st=o.start(e);
    const mv=ev=>o.move(ev,st);
    const up=ev=>{el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);o.end&&o.end(ev,st)};
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  });
}

/* ---- Classic, combo, color, stepped and compact all share this ---- */
function classic(host,o){
  const step=o.step||1,min=o.min,max=o.max,rng=max-min,fr=x=>(x-min)/rng;
  const root=h("div","cl"+(o.kind?" color "+o.kind:"")+(o.compact?" cmp":"")+(o.ticks?" has-ticks":""));
  let rowLbl=null;
  if(o.label&&!o.compact)root.append(h("span","lbl",o.label));
  const hit=h("div","hit");aria(hit,o.label||"Value",min,max);
  const trk=h("div","trk"),fillbar=h("div","fillbar");trk.append(fillbar);hit.append(trk);
  if(o.trackBg)trk.style.background=o.trackBg;
  const ticks=[];
  if(o.ticks){for(let i=0;i<=o.ticks;i++){const t=h("i","tick");t.style.setProperty("--p",i/o.ticks);hit.append(t);ticks.push(t)}}
  const thumb=h("div","thumb");hit.append(thumb);
  let val,unitEl=null,box=null;
  if(o.editable){box=h("label","valbox");val=h("input");val.setAttribute("aria-label",(o.label||"Value")+" number");val.inputMode="decimal";unitEl=h("span","u",o.unit||"");box.append(val,unitEl)}
  else if(o.boxed){box=h("div","valbox");val=h("span","val");box.append(val)}
  else val=h("span","val");
  root.append(hit,box||val);
  host.append(root);
  let v=o.def,prevX=fr(v);
  const sp=mk(fr(v),render),sc=mk(1,render,{mul:0.5});
  function bump(i){
    if(RM)return;const e=springEase(S.response,S.damping);
    ticks[i].animate([{transform:"scaleY(2.6)"},{transform:"scaleY(1)"}],{duration:e.duration,easing:e.easing});
  }
  function render(){
    hit.style.setProperty("--x",sp.x.toFixed(4));
    thumb.style.transform="translate(-50%,-50%) scale("+sc.x.toFixed(3)+")";
    if(o.ticks){const N=o.ticks;for(let i=0;i<=N;i++){const p=i/N;if((prevX-p)*(sp.x-p)<0||(sp.x===p&&prevX!==p))bump(i)}prevX=sp.x}
  }
  function text(){return o.fmt?o.fmt(v):String(v)+(o.unit&&!o.editable?o.unit:"")}
  function set(n){
    v=snapTo(n,min,max,step);
    hit.setAttribute("aria-valuenow",v);hit.setAttribute("aria-valuetext",o.fmt?o.fmt(v):v+(o.unit||""));
    if(o.editable){if(document.activeElement!==val)val.value=v}else val.textContent=text();
    go(sp,fr(v));o.onChange&&o.onChange(v);
  }
  const fromEv=e=>{const r=hit.getBoundingClientRect(),tw=thumb.offsetWidth;return min+clamp((e.clientX-r.left-tw/2)/(r.width-tw),0,1)*rng};
  drag(hit,{start:e=>{hit.classList.add("drag");root.classList.add("show");go(sc,1.18);set(fromEv(e))},move:e=>set(fromEv(e)),
    end:()=>{hit.classList.remove("drag");root.classList.remove("show");go(sc,1)}});
  keys(hit,{get:()=>v,set,min,max,step,def:o.def});
  if(o.editable){
    val.addEventListener("change",()=>{const n=parseFloat(val.value);if(isNaN(n))val.value=v;else{set(n);val.value=v}});
    val.addEventListener("keydown",e=>{
      if(e.key==="Enter"){val.blur();return}
      if(e.key==="Escape"){val.value=v;val.blur();return}
      if(e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();set(v+(e.key==="ArrowUp"?1:-1)*(e.shiftKey?step*10:step));val.value=v}
    });
  }
  put(sp,fr(v));prevX=sp.x;set(v);put(sp,fr(v));prevX=sp.x;
  return{root,hit,set,get:()=>v};
}

/* ---- Fill field and Elastic ---- */
function fillField(host,o){
  const min=0,max=100,step=1,fr=x=>(x-min)/(max-min);
  const root=h("div","ff");aria(root,o.label,min,max);
  const bg=h("div","ffbg"),fill=h("div","fffill");bg.append(fill);
  const lab=h("span","fftxt",o.label);let val=h("span","val");
  root.append(bg,lab,val);host.append(root);
  let v=o.def,editing=false,side=1;
  const sp=mk(fr(v),render),ex=mk(0,render,{elastic:true,mul:1});
  function render(){
    root.style.setProperty("--x",clamp(sp.x,-0.02,1.02).toFixed(4));
    bg.style.transformOrigin=side>0?"left center":"right center";
    bg.style.transform=ex.x?"scaleX("+(1+ex.x).toFixed(4)+")":"";
  }
  function set(n){
    v=snapTo(n,min,max,step);root.setAttribute("aria-valuenow",v);root.setAttribute("aria-valuetext",v+"%");
    val.textContent=v+"%";go(sp,fr(v));
  }
  function edit(){
    if(editing)return;editing=true;root.classList.add("edit");
    const inp=h("input","ffin");inp.value=v;inp.inputMode="decimal";inp.setAttribute("aria-label",o.label+" value");
    val.replaceWith(inp);inp.focus();inp.select();
    const done=ok=>{if(!editing)return;editing=false;root.classList.remove("edit");if(ok){const n=parseFloat(inp.value);if(!isNaN(n))set(n)}inp.replaceWith(val);root.focus({preventScroll:true})};
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();done(true)}else if(e.key==="Escape"){e.preventDefault();done(false)}e.stopPropagation()});
    inp.addEventListener("blur",()=>done(true));
  }
  const raw=e=>{const r=root.getBoundingClientRect();return(e.clientX-r.left)/r.width};
  drag(root,{filter:e=>!(e.target instanceof HTMLInputElement),
    start:e=>({x0:e.clientX,moved:false}),
    move:(e,st)=>{
      if(!st.moved&&Math.abs(e.clientX-st.x0)<4)return;
      if(!st.moved){st.moved=true;root.classList.add("drag")}
      const f=raw(e);let over=0;
      if(f<0)over=f;else if(f>1)over=f-1;
      set(min+clamp(f,0,1)*(max-min));
      if(o.elastic){
        if(over!==0){
          side=over>0?1:-1;
          const k=4*(1.05-S.rubber);
          const s=0.12*(1-1/(1+Math.abs(over)*k));
          put(ex,s);st.stretched=true;
        }else if(st.stretched){st.stretched=false;go(ex,0)}
      }
    },
    end:(e,st)=>{
      root.classList.remove("drag");
      if(!st.moved)edit();
      else if(o.elastic&&(ex.x||ex.to)){ex.v=0;go(ex,0)}
    }});
  keys(root,{get:()=>v,set,min,max,step,def:o.def,edit});
  set(v);put(sp,fr(v));
}

/* ---- Scrub number field ---- */
function scrub(host,o){
  const step=o.step||1,min=o.min,max=o.max;
  const root=h("div","sf");
  const lab=h("span","sflab",o.lab);aria(lab,o.name,min,max);
  const inp=h("input");inp.inputMode="decimal";inp.setAttribute("aria-label",o.name+" number");
  const u=h("span","u",o.unit||"");
  root.append(lab,inp,u);host.append(root);
  let v=o.def;const nx=mk(0,render,{mul:0.6});
  function render(){inp.style.transform=nx.x?"translateX("+nx.x.toFixed(2)+"px)":""}
  function set(n,kick){
    const old=v;v=snapTo(n,min,max,step);
    lab.setAttribute("aria-valuenow",v);lab.setAttribute("aria-valuetext",v+(o.unit||""));
    if(document.activeElement!==inp)inp.value=v;
    if(kick&&v!==old&&!RM){nx.x=Math.sign(v-old)*3;nx.v=0;go(nx,0)}
  }
  drag(lab,{start:e=>{root.classList.add("drag");return{x0:e.clientX,v0:v}},
    move:(e,st)=>{const fine=e.shiftKey?0.1:1;set(st.v0+(e.clientX-st.x0)*0.5*fine*step,true);inp.value=v},
    end:()=>root.classList.remove("drag")});
  keys(lab,{get:()=>v,set:n=>{set(n,true);inp.value=v},min,max,step,def:o.def});
  inp.addEventListener("change",()=>{const n=parseFloat(inp.value);if(!isNaN(n))set(n,true);inp.value=v});
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){inp.blur();return}
    if(e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();set(v+(e.key==="ArrowUp"?1:-1)*(e.shiftKey?step*10:step),true);inp.value=v}
  });
  set(v);
}

/* ---- Range ---- */
function range(host,o){
  const min=0,max=100,step=1,gap=4,fr=x=>(x-min)/(max-min);
  const root=h("div","cl rg");root.append(h("span","lbl",o.label));
  const hit=h("div","hit");const trk=h("div","trk"),fillbar=h("div","fillbar");trk.append(fillbar);hit.append(trk);
  const t=[h("div","thumb t1"),h("div","thumb t2")];
  t.forEach((el,i)=>{aria(el,i?"Maximum":"Minimum",min,max);hit.append(el)});
  const val=h("span","val");val.style.cssText="flex:none;width:64px;text-align:right";
  root.append(hit,val);host.append(root);
  const V=[o.def[0],o.def[1]];
  const sp=[mk(fr(V[0]),render),mk(fr(V[1]),render)];
  function render(){hit.style.setProperty("--lo",sp[0].x.toFixed(4));hit.style.setProperty("--hi",sp[1].x.toFixed(4))}
  function set(i,n){
    n=snapTo(n,min,max,step);n=i?Math.max(n,V[0]+gap):Math.min(n,V[1]-gap);n=clamp(n,min,max);V[i]=n;
    t[0].setAttribute("aria-valuemax",V[1]-gap);t[1].setAttribute("aria-valuemin",V[0]+gap);
    t[i].setAttribute("aria-valuenow",n);t[i^1].setAttribute("aria-valuenow",V[i^1]);
    val.textContent=V[0]+" - "+V[1];go(sp[i],fr(n));
  }
  const fromEv=e=>{const r=hit.getBoundingClientRect(),tw=t[0].offsetWidth;return min+clamp((e.clientX-r.left-tw/2)/(r.width-tw),0,1)*(max-min)};
  drag(hit,{start:e=>{
      const n=fromEv(e);let i=e.target===t[0]?0:e.target===t[1]?1:(Math.abs(n-V[0])<Math.abs(n-V[1])||(V[0]===V[1]&&n<V[0])?0:1);
      hit.classList.add("drag");t[i].focus({preventScroll:true});set(i,n);return{i}},
    move:(e,st)=>set(st.i,fromEv(e)),end:()=>hit.classList.remove("drag")});
  t.forEach((el,i)=>keys(el,{get:()=>V[i],set:n=>set(i,n),min,max,step,def:o.def[i]}));
  set(0,V[0]);set(1,V[1]);put(sp[0],fr(V[0]));put(sp[1],fr(V[1]));
}

/* ---- Angle dial ---- */
function dial(host,o){
  const root=h("div","dialrow");
  const d=h("div","dial");aria(d,"Rotation",0,359);
  const ind=h("div","ind"),hub=h("div","hub");
  d.append(h("i","c1"),h("i","c2"),h("i","c3"),h("i","c4"),ind,hub);
  const val=h("span","val","0deg");root.append(d,val);host.append(root);
  let v=o.def,tgt=v;
  const sp=mk(v/360,render);
  function render(){ind.style.transform="rotate("+(sp.x*360).toFixed(2)+"deg)"}
  function set(n){
    const nv=((Math.round(n)%360)+360)%360;
    const delta=((nv-tgt)%360+540)%360-180;tgt+=delta;v=nv;
    d.setAttribute("aria-valuenow",v);d.setAttribute("aria-valuetext",v+" degrees");val.textContent=v+"deg";
    go(sp,tgt/360);
  }
  const fromEv=e=>{const r=d.getBoundingClientRect();const a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI+90;return a};
  drag(d,{start:e=>{d.classList.add("drag");d.focus({preventScroll:true});set(fromEv(e))},move:e=>set(e.shiftKey?Math.round(fromEv(e)/15)*15:fromEv(e)),end:()=>d.classList.remove("drag")});
  keys(d,{get:()=>v,set,min:0,max:359,step:1,def:o.def});
  set(v);put(sp,tgt/360);
}

/* ---- Card definitions ---- */
const swHue=210;
const VARIANTS=[
 {t:"Classic",best:"Best for: opacity, in the right panel. Familiar and precise.",make:(m)=>classic(m,{label:"Opacity",min:0,max:100,def:100,unit:"%",boxed:true})},
 {t:"Fill field",best:"Best for: dense property rows. Label, value and control in one field.",make:(m)=>{fillField(m,{label:"Opacity",def:70})}},
 {t:"Scrub number field",best:"Best for: position, size, rotation. Drag the letter, or type.",make:(m)=>{const g=h("div","sfs");m.append(g);scrub(g,{lab:"O",name:"Opacity",min:0,max:100,def:100,unit:"%"});scrub(g,{lab:"R",name:"Rotation",min:-180,max:180,def:0,unit:"deg"})}},
 {t:"Elastic",best:"Best for: a playful feel on rare, big controls. Drag past an end.",make:(m)=>{fillField(m,{label:"Intensity",def:50,elastic:true})}},
 {t:"Stepped with detents",best:"Best for: weights, density, zoom levels. Snaps with a bump.",steps:true,make:(m)=>classic(m,{label:"Density",min:0,max:S.steps,def:Math.round(S.steps/2),ticks:S.steps,fmt:v=>v+" / "+S.steps,boxed:true})},
 {t:"Range",best:"Best for: min and max, such as a visible time range.",make:(m)=>range(m,{label:"Range",def:[20,75]})},
 {t:"Slider + input combo",best:"Best for: sizes and spacing with a unit. Precise by slider or by typing.",make:(m)=>{
    classic(m,{label:"Opacity",min:0,max:100,def:80,unit:"%",editable:true});
    classic(m,{label:"Radius",min:0,max:64,def:8,unit:"px",editable:true});
    classic(m,{label:"Rotate",min:-180,max:180,def:0,unit:"deg",editable:true})}},
 {t:"Color sliders",best:"Best for: the color picker. Hue and opacity.",make:(m)=>{
    const wrap=h("div","colors");m.append(wrap);
    wrap.style.setProperty("--hue",swHue);wrap.style.setProperty("--al",1);
    const sw=h("div","swatch");
    const r1=h("div","cr"),r2=h("div","cr");
    wrap.append(r1,r2);
    classic(r1,{label:"Hue",min:0,max:360,def:swHue,unit:"deg",kind:"hue",trackBg:"linear-gradient(to right,hsl(0 80% 50%),hsl(60 80% 50%),hsl(120 80% 50%),hsl(180 80% 50%),hsl(240 80% 50%),hsl(300 80% 50%),hsl(360 80% 50%))",boxed:true,onChange:v=>wrap.style.setProperty("--hue",v)});
    const a=classic(r2,{label:"Opacity",min:0,max:100,def:100,unit:"%",kind:"alpha",trackBg:"linear-gradient(to right,hsl(var(--hue) 80% 50% / 0),hsl(var(--hue) 80% 50%)),conic-gradient(#bbb 25%,#fff 0 50%,#bbb 0 75%,#fff 0) 0 0/8px 8px",boxed:true,onChange:v=>wrap.style.setProperty("--al",v/100)});
    r1.append(sw);const sp2=h("span");sp2.style.cssText="width:44px;flex:none";r2.append(sp2)}},
 {t:"Angle dial",best:"Best for: rotation and gradient angle. Drag around it, Shift snaps to 15.",make:(m)=>dial(m,{def:45})},
 {t:"Compact inline",best:"Best for: a property row such as blur in Effects. Value shows on hover.",make:(m)=>{
    [["Blur",0,40,12,"px"],["Spread",0,40,4,"px"]].forEach(a=>{
      const pr=h("div","pr");pr.append(h("span","lbl",a[0]));m.append(pr);
      classic(pr,{label:a[0],min:a[1],max:a[2],def:a[3],unit:a[4],compact:true});
    })}}
];

const grid=$("#grid");const cards=[];
VARIANTS.forEach((V,i)=>{
  const n=i+1;
  const card=h("article","card");card.dataset.n=n;
  const hd=h("header");hd.append(h("span","num","0"+n),h("h2","",V.t));
  const sim=h("div","sim"),real=h("div","host");sim.append(real);
  const demo=h("div","demo");demo.append(h("span","micro","Larger demo"));const big=h("div","host big");demo.append(big);
  const ft=h("footer");const pick=h("button","btn");pick.type="button";ft.append(pick);
  card.append(hd,h("p","best",V.best),sim,demo,ft);grid.append(card);
  const build=()=>{real.textContent="";big.textContent="";V.make(real);V.make(big)};
  build();
  pick.addEventListener("click",()=>{S.picked=S.picked===n?null:n;save();paint();out()});
  cards.push({n,card,pick,build,V});
});
function paint(){cards.forEach(c=>{const on=S.picked===c.n;c.card.classList.toggle("chosen",on);c.pick.classList.toggle("pri",on);c.pick.setAttribute("aria-pressed",on);c.pick.textContent=on?"Picked":"Pick this"})}

/* ---- tuning panel ---- */
const fields=["response","damping","rubber","steps"];
const outEl=$("#out");
function json(){return JSON.stringify({variant:S.picked,response:S.response,damping:S.damping,rubber:S.rubber,steps:S.steps},null,2)}
function out(){outEl.value=json()}
fields.forEach(k=>{
  const inp=$("#i-"+k),o=$("#o-"+k);inp.value=S[k];o.textContent=S[k];
  inp.addEventListener("input",()=>{
    S[k]=+inp.value;o.textContent=S[k];save();out();
    if(k==="steps")cards.forEach(c=>{if(c.V.steps)c.build()});
  });
});
$("#copy").addEventListener("click",async e=>{
  out();outEl.focus();outEl.select();
  const b=e.currentTarget;let ok=false;
  try{await navigator.clipboard.writeText(json());ok=true}catch(x){try{ok=document.execCommand("copy")}catch(y){}}
  b.textContent=ok?"Copied":"Select and copy below";setTimeout(()=>{b.textContent="Copy values"},1600);
});
document.querySelectorAll("[data-th]").forEach(b=>{
  b.setAttribute("aria-pressed",String(b.dataset.th===S.theme));
  b.addEventListener("click",()=>{
    S.theme=b.dataset.th;document.documentElement.dataset.theme=S.theme;save();
    document.querySelectorAll("[data-th]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  });
});
document.documentElement.dataset.theme=S.theme==="noir"?"noir":"paper";
paint();out();
</script>
