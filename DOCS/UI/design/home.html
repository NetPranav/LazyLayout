<!-- Copied from the editor prototype: theme init script (key ll-theme-v2, default warm) -->
<script>try{var t=localStorage.getItem('ll-theme-v2');document.documentElement.dataset.theme=['paper','dark','white','warm','lilac','graphite','darkroom','noir'].indexOf(t)>-1?t:'warm'}catch(e){document.documentElement.dataset.theme='warm'}</script>
<style>
/* Copied from the editor prototype: base CSS (tokens, reset, .ib, .btn, .micro, focus ring, radii) */
:root{
  --sans:"Geist",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
  --r-sm:4px;--r-md:6px;--r-lg:8px;
  --ruler:18px;
  /* Motion tokens. The spring engine (ported from Nook) writes the pop curve for the active feel (Smooth, Lively or Bouncy). These defaults hold until it runs. */
  --ll-ease-pop:ease-out;--ll-dur-pop:200ms;--ll-dur-fade:120ms;
}
*{box-sizing:border-box;margin:0;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
html,body{height:100%}
body{background:var(--canvas);color:var(--text);font:13px/1.4 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--text);outline-offset:-2px}
.defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.micro{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
.sp{flex:1}
.hl{height:1px;background:var(--border);margin:4px 0;flex:none}
.hide{display:none!important}
.ib{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--text2);flex:none}
.ib:hover{background:var(--seg);color:var(--text)}
.ib[aria-pressed=true]{background:var(--sel);color:var(--sel-fg)}
.ib.more{font:600 13px/1 var(--sans);letter-spacing:.08em}
.btn{height:32px;padding:0 12px;border-radius:var(--r-md);font-weight:500;border:1px solid var(--border);display:flex;align-items:center;gap:6px;color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.strong{background:var(--panel);color:var(--text);border-color:var(--text)}
.btn:disabled{background:var(--canvas);color:var(--muted);border-color:var(--border);cursor:not-allowed}
.wfull{width:100%;justify-content:center}
/* Copied from the editor prototype: all eight theme blocks (Warm default light, Darkroom default dark; no Plum) */
/* ===== TOP BAR (52px, same when panels collapse) ===== */
/* Semantic theme tokens. dark is the default (:root). Components use only these. */
:root,[data-theme=dark]{--seg:#444444;--backdrop:#141414;--canvas:#1E1E1E;--panel:#2C2C2C;--bar:#383838;--border:#444444;--text:#FFFFFF;--text2:#BFBFBF;--muted:#A1A1A1;--ctl:#FFFFFF;--ctl-fg:#1E1E1E;--float:#383838;--hover:#2C2C2C;--sel:#383838;--sel-fg:#FFFFFF;--shipbg:#383838;--ship-fg:#FFFFFF;--avatar:#444444;--avatar-fg:#FFFFFF;--sw-fill:#2C2C2C;--sw-a:#FFFFFF;--board:#383838;--boardline:#444444;--ph:#2C2C2C;--swline:#444444;--thumb:#1E1E1E;--thumbline:#444444;--shadow:0 4px 16px rgba(0,0,0,.5)}

[data-theme=warm]{--seg:#E3DBCC;--backdrop:#F3F0E9;--canvas:#F3F0E9;--panel:#FDFCF8;--bar:#F3F0E9;--border:#E3DBCC;--text:#101010;--text2:#5A5549;--muted:#6E6859;--ctl:#101010;--ctl-fg:#FDFCF8;--float:#FDFCF8;--hover:#E3DBCC;--sel:#E3DBCC;--sel-fg:#101010;--shipbg:#F3F0E9;--ship-fg:#101010;--avatar:#E3DBCC;--avatar-fg:#101010;--sw-fill:#E3DBCC;--sw-a:#101010;--board:#FFFFFF;--boardline:#E3DBCC;--ph:#E3DBCC;--swline:#E3DBCC;--thumb:#F3F0E9;--thumbline:#E3DBCC;--shadow:0 4px 16px rgba(16,16,16,.08)}
[data-theme=lilac]{--seg:#E7E6E1;--backdrop:#E7E6E1;--canvas:#E7E6E1;--panel:#F4F3EF;--bar:#EEEDE8;--border:#CECDC8;--text:#22231E;--text2:#55554F;--muted:#66665F;--ctl:#22231E;--ctl-fg:#F4F3EF;--float:#F4F3EF;--hover:#E7E6E1;--sel:#CEB4F5;--sel-fg:#22231E;--shipbg:#CEB4F5;--ship-fg:#22231E;--avatar:#E7E6E1;--avatar-fg:#22231E;--board:#FFFFFF;--boardline:#CECDC8;--ph:#E7E6E1;--swline:#CECDC8;--thumb:#EEEDE8;--thumbline:#CECDC8;--shadow:0 4px 16px rgba(34,35,30,.1);--sw-fill:#CEB4F5;--sw-a:#22231E}
[data-theme=paper]{--seg:#E7E6E1;--backdrop:#E7E6E1;--canvas:#E7E6E1;--panel:#F4F3EF;--bar:#EEEDE8;--border:#CECDC8;--text:#22231E;--text2:#55554F;--muted:#66665F;--ctl:#22231E;--ctl-fg:#F4F3EF;--float:#F4F3EF;--hover:#E7E6E1;--sel:#E7E6E1;--sel-fg:#22231E;--shipbg:#E7E6E1;--ship-fg:#22231E;--avatar:#E7E6E1;--avatar-fg:#22231E;--board:#FFFFFF;--boardline:#CECDC8;--ph:#E7E6E1;--swline:#CECDC8;--thumb:#EEEDE8;--thumbline:#CECDC8;--shadow:0 4px 16px rgba(34,35,30,.1);--sw-fill:#F4F3EF;--sw-a:#22231E}
[data-theme=graphite]{--seg:#42423B;--backdrop:#141411;--canvas:#1C1C18;--panel:#262621;--bar:#32322C;--border:#42423B;--text:#F4F3EF;--text2:#BDBCB3;--muted:#A09F96;--ctl:#F4F3EF;--ctl-fg:#22231E;--float:#32322C;--hover:#32322C;--sel:#32322C;--sel-fg:#F4F3EF;--shipbg:#32322C;--ship-fg:#F4F3EF;--avatar:#42423B;--avatar-fg:#F4F3EF;--sw-fill:#262621;--sw-a:#F4F3EF;--board:#32322C;--boardline:#42423B;--ph:#262621;--swline:#42423B;--thumb:#1C1C18;--thumbline:#42423B;--shadow:0 4px 16px rgba(0,0,0,.5)}
[data-theme=darkroom]{--seg:#34342C;--backdrop:#10100B;--canvas:#26261F;--panel:#16160F;--bar:#20201A;--border:#34342C;--text:#F4F3EF;--text2:#BDBCB3;--muted:#A09F96;--ctl:#F4F3EF;--ctl-fg:#22231E;--float:#16160F;--hover:#20201A;--sel:#2A2A23;--sel-fg:#F4F3EF;--shipbg:#2A2A23;--ship-fg:#F4F3EF;--avatar:#34342C;--avatar-fg:#F4F3EF;--sw-fill:#20201A;--sw-a:#F4F3EF;--board:#32322A;--boardline:#3E3E35;--ph:#26261F;--swline:#3E3E35;--thumb:#20201A;--thumbline:#34342C;--shadow:0 4px 16px rgba(0,0,0,.6)}
[data-theme=noir]{--seg:#292629;--backdrop:#050505;--canvas:#141214;--panel:#080808;--bar:#141214;--border:#292629;--text:#ECEBE5;--text2:#A3A3A3;--muted:#8F8F8F;--ctl:#ECEBE5;--ctl-fg:#080808;--float:#080808;--hover:#1C1A1C;--sel:#292629;--sel-fg:#ECEBE5;--shipbg:#CEB4F5;--ship-fg:#080808;--avatar:#292629;--avatar-fg:#ECEBE5;--sw-fill:#141214;--sw-a:#ECEBE5;--board:#1C1A1C;--boardline:#343034;--ph:#141214;--swline:#343034;--thumb:#141214;--thumbline:#292629;--shadow:0 4px 16px rgba(0,0,0,.7)}
/* Copied from the editor prototype: 52px top bar, trace-loader logo (.tro/.tfl), theme button, avatar */
.top{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch;height:52px;padding:0;background:var(--panel);border-bottom:1px solid var(--border);min-width:0;position:relative;z-index:2}
.tl{display:flex;align-items:center;gap:8px;min-width:0;justify-self:start;padding-left:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.logo{width:32px;height:32px;display:grid;place-items:center;color:var(--text)}
.logo svg{width:20px;height:20px}
.logo:hover svg{opacity:.7}
.logo svg{overflow:visible}.logo .tfl{fill:currentColor;stroke:none}.logo .tro{fill:none;stroke:currentColor;stroke-width:10;stroke-linejoin:round;opacity:0}
.logo.saving-on .tfl{animation:ll-trf 1.6s cubic-bezier(.65,0,.35,1) infinite alternate}
.logo.saving-on .tro{stroke-dasharray:100;animation:ll-tro 1.6s cubic-bezier(.65,0,.35,1) infinite alternate}
@keyframes ll-tro{0%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}
@keyframes ll-trf{0%,55%{opacity:0}85%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.logo.saving-on .tro{animation:none;opacity:0}.logo.saving-on .tfl{animation:ll-fade 2.8s ease-in-out infinite}}
/* 1px divider: .tl gap (8px) + 4px margin = 12px each side */
.tdiv{width:1px;height:20px;margin:0 4px;flex:none;align-self:center;background:var(--border)}
.pagebtn{display:flex;align-items:center;gap:4px;height:32px;padding:0;font-size:13px;font-weight:500;color:var(--text);white-space:nowrap}
.pagebtn:hover{color:var(--text)}
.pagebtn svg{width:14px;height:14px}
.tr{display:flex;align-items:center;gap:8px;min-width:0;justify-self:end;height:100%;padding-right:16px}
.themebtn{width:32px;height:32px;align-self:center;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.themebtn:hover{background:var(--seg);color:var(--text)}
.themebtn svg{width:16px;height:16px}
.av{width:28px;height:28px;display:grid;place-items:center;border-radius:var(--r-md);background:var(--avatar);color:var(--avatar-fg);font:500 11px/1 var(--sans)}
.av.more{color:var(--muted)}
/* Copied from the editor prototype: menus, playful highlight and dropdown fields (shared surface CSS) */
/* Menus and dropdowns (shared), appended to body so the header never clips them */
.menu{position:absolute;z-index:20;background:var(--float);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);min-width:200px;padding:4px 0;display:block;max-height:70vh;overflow:auto;overscroll-behavior:contain;transform-origin:left top}
.menu.wide{width:320px;min-width:0;padding:0}
.menu .ico:has(.tpv){width:28px}
.tpv{position:relative;display:block;width:28px;height:18px;flex:none;box-sizing:border-box;border-radius:3px;border:1px solid var(--border);overflow:hidden;background:linear-gradient(to right,var(--c) 60%,var(--p) 60%)}
.tpv::after{content:"";position:absolute;left:calc(30% - 5px);top:calc(50% - 2px);width:10px;height:4px;border-radius:1px;background:var(--k)}
.tpv.t-dark{--c:#1E1E1E;--p:#2C2C2C;--k:#FFFFFF}
.tpv.t-white{--c:#F5F5F5;--p:#FFFFFF;--k:#000000}
.tpv.t-warm{--c:#F3F0E9;--p:#FDFCF8;--k:#101010}
.tpv.t-lilac{--c:#E7E6E1;--p:#F4F3EF;--k:#CEB4F5}
.tpv.t-paper{--c:#E7E6E1;--p:#F4F3EF;--k:#22231E}
.tpv.t-graphite{--c:#1C1C18;--p:#262621;--k:#F4F3EF}
.tpv.t-darkroom{--c:#26261F;--p:#16160F;--k:#F4F3EF}
.tpv.t-noir{--c:#141214;--p:#080808;--k:#CEB4F5}
.menu [role=menuitem]{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 12px;color:var(--text2);text-align:left;white-space:nowrap}
.menu [role=menuitem]:hover,.menu [role=menuitem].on{color:var(--text)}
.menu [role=menuitem]:disabled,.menu [role=menuitem]:disabled:hover{background:none;color:var(--muted);cursor:default;opacity:.45}
.menu.ctx{width:248px;min-width:0;padding:4px;border-radius:var(--r-lg)}
.menu.ctx [role=menuitem]{padding:0 12px;border-radius:var(--r-sm)}
#sub::after{content:"";position:absolute;top:0;bottom:0;left:-4px;width:4px}
#sub.flip::after{left:auto;right:-4px}
.menu .ico{width:16px;height:16px;flex:none;display:grid;place-items:center;color:var(--muted)}
.menu .chv{margin-left:auto;color:var(--muted)}
.menu [role=menuitem] kbd{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.menu .grp{padding:8px 12px 4px;border-top:1px solid var(--border)}
.menu .grp:first-child{border-top:0}
.menu .hl{margin:4px 0}
.mini{height:24px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-weight:500;font-size:11px;flex:none}
.mini:hover{background:var(--panel)}

/* Shared motion. Open, close, the scroll bump and layout changes are driven by the spring engine (JS), the way Nook drives its island: each overlay is one surface whose size is physics. CSS holds rest states and the highlight. Reduced motion: a short opacity fade only. */
:is(.menu,.vpop,.ppop,.ins){visibility:hidden;pointer-events:none}
:is(.menu,.vpop,.ppop,.ins).open{visibility:visible;pointer-events:auto}
:is(.menu,.vpop,.ppop,.ins)[data-lv]{visibility:visible}
:is(.menu,.vpop,.ppop,.ins)[data-mv]{overflow:hidden!important;max-height:none!important;min-width:0!important}
.ll-lay{position:relative;isolation:isolate;display:flow-root}
.vpop>.ll-lay,.ppop>.ll-lay{display:flex;flex-direction:column;flex:none}
.ins>.ll-lay{display:flex;flex-direction:column;flex:1;min-height:0}
.ll-hl{position:absolute;left:0;top:0;z-index:-1;width:100%;height:32px;border-radius:var(--r-sm);background:var(--hover);transform-origin:50% 50%;opacity:0;pointer-events:none;will-change:transform;transition:opacity var(--ll-dur-fade) ease-out}
.ll-hl.show{opacity:1}
.menu:not(.ctx) .ll-hl,#vpop .ll-hl{border-radius:0}
.menu.kb .ll-hl{outline:2px solid var(--text);outline-offset:-2px}
.menu .chv{transition:rotate var(--ll-dur-pop) var(--ll-ease-pop)}
.menu [role=menuitem].subopen .chv{rotate:90deg}
.menu:focus{outline:none}
@media (prefers-reduced-motion:reduce){
  .menu .chv{transition:none}
}

/* Dropdown fields: the field is the seed of the list surface (same spring engine as the menus) */
.dnat{display:none}
.dfield.dd{position:relative;transition:scale var(--ll-dur-pop) var(--ll-ease-pop),border-color .12s}
.dfield.dd:has(.dd-f:active:not(:disabled)){scale:.97}
.dfield.dd::after{content:"";position:absolute;inset:-3px;border:2px solid var(--text);border-radius:calc(var(--r-sm) + 3px);opacity:0;scale:1.06;pointer-events:none;transition:opacity .12s ease-out,scale var(--ll-dur-pop) var(--ll-ease-pop)}
.dfield.dd:has(.dd-f:focus-visible)::after{opacity:1;scale:1}
.dd-f{all:unset;box-sizing:border-box;flex:1;min-width:0;height:100%;display:flex;align-items:center;font:400 11px var(--mono);color:var(--text);cursor:pointer;white-space:nowrap}
.dd-f:disabled{cursor:default}
.dd-f .ddt{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;transform-origin:0 50%}
.dfield.dd .dchev{transition:translate var(--ll-dur-pop) var(--ll-ease-pop),rotate var(--ll-dur-pop) var(--ll-ease-pop)}
.dfield.dd:not(.dis):hover .dchev{translate:0 1.5px}
.dfield.dd.open .dchev,.dfield.dd.open:hover .dchev{rotate:180deg;translate:0 0}
.dfield.dd.dis{opacity:.45}
.dfield.dd.dis,.dfield.dd.dis .dchev{transition:none}
.dfield.mixed .ddt{color:var(--muted)}
@keyframes ddshim{from{background-position:-120% 0}to{background-position:240% 0}}
.dfield.mixed:not(.dis){background-image:linear-gradient(100deg,transparent 30%,var(--hover) 50%,transparent 70%);background-repeat:no-repeat;background-size:60% 100%;animation:ddshim .9s ease-out 1 both}
.pagebtn,.lbl{outline:2px solid transparent;outline-offset:2px;transition:scale var(--ll-dur-pop) var(--ll-ease-pop),outline-color .12s,outline-offset var(--ll-dur-pop) var(--ll-ease-pop)}
.pagebtn:focus-visible,.lbl:focus-visible{outline-color:var(--text);outline-offset:-2px}
.pagebtn:active,.lbl:active{scale:.97}
.pagebtn svg,.lbl svg{transition:translate var(--ll-dur-pop) var(--ll-ease-pop),rotate var(--ll-dur-pop) var(--ll-ease-pop)}
.pagebtn:hover svg,.lbl:hover svg{translate:0 1.5px}
.pagebtn[aria-expanded=true] svg,.lbl[aria-expanded=true] svg{rotate:180deg;translate:0 0}
.menu.dd{z-index:80;padding:0;min-width:0;max-height:none;overflow:hidden}
.dd-s{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-bottom:1px solid var(--border);color:var(--muted)}
.dd-s input{all:unset;flex:1;min-width:0;font:400 12px var(--sans);color:var(--text)}
.dd-s input::placeholder{color:var(--muted)}
.ddl{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
.ddl:focus{outline:none}
.ddi{position:relative;isolation:isolate;padding:4px}
.menu.dd .ddi .ll-hl{border-radius:var(--r-sm)}
.dd-o{display:block;height:28px;cursor:pointer;color:var(--text2)}
.dd-o.on,.dd-o.cur{color:var(--text)}
.dd-i{display:flex;align-items:center;gap:8px;height:100%;padding:0 12px 0 32px;font:400 12px var(--sans);white-space:nowrap;transform-origin:20% 50%}
.dd-a .dd-i{padding-left:12px}
.dd-h{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.dd-sep{height:1px;margin:4px -4px;background:var(--border)}
.dd-ck,.dd-gh{position:absolute;left:12px;top:0;width:14px;height:14px;pointer-events:none;color:var(--text)}
.dd-ck svg,.dd-gh svg{width:14px;height:14px}
.dd-ck{opacity:0}
.dd-gh{opacity:0;transition:opacity .12s ease-out,translate .1s ease-out}
.dd-none{display:flex;align-items:center;justify-content:center;height:56px;color:var(--muted);font:400 12px var(--sans)}
.dd-rm{position:absolute;pointer-events:none}
.gone{display:none!important}
@media (prefers-reduced-motion:reduce){
  .dfield.dd,.dfield.dd::after,.dfield.dd .dchev,.pagebtn,.lbl,.pagebtn svg,.lbl svg,.dd-gh{transition:none}
  .dfield.mixed{animation:none;background-image:none}
}

/* Copied from the editor prototype: segmented control, menu heading, label swatch, field, command palette, trace loader */
.seg{display:flex;border:1px solid var(--border);border-radius:var(--r-md);padding:2px;gap:2px}
.seg button{height:26px;padding:0 10px;border-radius:var(--r-sm);color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--seg);color:var(--text)}
.seg.fill{width:100%}.seg.fill button{flex:1;justify-content:center}
.mh{padding:8px 12px 4px;font-size:11px;font-weight:500;color:var(--muted);cursor:default;user-select:none}
.lsw{display:block;width:12px;height:12px;border-radius:2px;background:var(--c)}
.dfield{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;background:var(--bar);border:1px solid transparent;border-radius:var(--r-sm);min-width:0}
.dfield:hover{border-color:var(--muted)}
.dfield:focus-within{border-color:var(--text)}
.dfield input{all:unset;flex:1;min-width:0;font:400 11px var(--mono);color:var(--text);text-align:left}
.dfield.mixed input{color:var(--muted)}
.dfield .pf,.dfield .sf{font:500 11px var(--mono);color:var(--muted);flex:none}
.cmdk{position:fixed;left:50%;top:15vh;transform:translateX(-50%);z-index:70;width:520px;max-width:calc(100vw - 16px);background:var(--float);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.cmdk[hidden]{display:none}
.cki{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-bottom:1px solid var(--border);color:var(--muted)}
.cki input{all:unset;flex:1;min-width:0;font-size:14px;color:var(--text)}
.ckl{max-height:360px;overflow:auto;padding:4px}
.cko{display:flex;align-items:center;justify-content:space-between;gap:8px;height:32px;padding:0 12px;border-radius:var(--r-sm);color:var(--text2);cursor:default}
.cko.on{background:var(--sel);color:var(--sel-fg)}
.cko kbd{font:500 11px var(--mono);color:var(--muted)}
.cko.on kbd{color:var(--sel-fg)}
.ckn{padding:16px;color:var(--muted)}
.tpb{padding:16px;color:var(--muted);font-size:12px}

/* Inspector (motion and code, accordion rows) */
.prow{border-bottom:1px solid var(--border)}
.prow-h{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 16px;text-align:left;color:var(--text)}
.aiload{width:20px;height:20px;flex:none;color:var(--text)}
.aiload{overflow:visible}.aiload .tro{fill:none;stroke:currentColor;stroke-width:10;stroke-linejoin:round;stroke-dasharray:100;animation:ll-tro 2.4s cubic-bezier(.65,0,.35,1) infinite alternate}
.aiload .tfl{fill:currentColor;stroke:none;animation:ll-trf 2.4s cubic-bezier(.65,0,.35,1) infinite alternate}
@media (prefers-reduced-motion:reduce){.aiload .tro{animation:none;opacity:0}.aiload .tfl{animation:ll-fade 2.8s ease-in-out infinite}}
@keyframes ll-fade{0%,100%{opacity:1}50%{opacity:.4}}
/* ===== Home ===== */
/* Home: the project hub. One 4px grid, hairline borders, soft shadows, theme vars only. No glass, no pills. */
.home{display:grid;height:100%;position:relative;--rw:224px;grid-template-columns:var(--rw) minmax(0,1fr);grid-template-rows:52px minmax(0,1fr)}
body{overflow:hidden}
.kbd,kbd{font:500 11px var(--mono);color:var(--muted)}
.top .tl{padding-left:10px}
.railbtn{display:none}
.srch{justify-self:center;display:flex;align-items:center;gap:8px;width:min(360px,34vw);height:32px;padding:0 8px 0 10px;align-self:center;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-md);color:var(--muted);text-align:left;transition:border-color .12s,scale var(--ll-dur-pop) var(--ll-ease-pop)}
.srch:hover{border-color:var(--muted)}
.srch:active{scale:.985}
.srch span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch kbd{padding:2px 6px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel)}
.themebtn{position:relative;overflow:hidden}
.themebtn svg{transition:rotate var(--ll-dur-pop) var(--ll-ease-pop),scale var(--ll-dur-pop) var(--ll-ease-pop)}
.bellb{position:relative;width:32px;height:32px;align-self:center;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--muted)}
.bellb:hover{background:var(--seg);color:var(--text)}
.bellb .cn{position:absolute;right:2px;top:2px;min-width:14px;height:14px;padding:0 3px;display:grid;place-items:center;background:var(--ctl);color:var(--ctl-fg);border-radius:var(--r-sm);font:500 9px/1 var(--mono)}
.acct{width:32px;height:32px;align-self:center;display:grid;place-items:center;border-radius:var(--r-sm)}
.acct .av{width:28px;height:28px;border-radius:var(--r-sm);transition:scale var(--ll-dur-pop) var(--ll-ease-pop)}
.acct:hover .av{scale:1.06}
.acct:active .av{scale:.94}
.pagebtn{padding:0 6px 0 8px;border-radius:var(--r-sm)}
.pagebtn:hover{background:var(--seg)}
.pagebtn #wslabel{font-size:14px}

/* Left rail */
.rail{grid-column:1;grid-row:2;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--panel);border-right:1px solid var(--border)}
.rnav{position:relative;isolation:isolate;margin:12px 12px 0;display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto}
.rnav .ll-hl{left:0!important;width:100%!important;background:var(--sel)}
.ri{display:flex;align-items:center;gap:12px;width:100%;height:32px;padding:0 8px;border-radius:var(--r-sm);color:var(--text2);white-space:nowrap;flex:none;position:relative;transition:color .12s,background-color .12s,scale var(--ll-dur-pop) var(--ll-ease-pop)}
.ri:hover{color:var(--text)}
.ri:not([aria-current=true]):hover{background:color-mix(in srgb,var(--sel) 55%,transparent)}
.ri:active{scale:.97}
.ri[aria-current=true]{color:var(--sel-fg)}
.ri:focus-visible{outline-offset:-2px}
.ri .rl{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ri .rc{font:500 11px var(--mono);color:var(--muted)}
.rh{padding:20px 8px 4px;height:36px;display:flex;align-items:flex-end;flex:none}
.rfoot{flex:none;margin:0 12px;padding:8px 0 52px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.stor{padding:8px 8px 12px;display:flex;flex-direction:column;gap:8px}
.stor .sm{display:flex;justify-content:space-between;align-items:baseline}
.stor .sm .mono{font-size:11px;color:var(--text2)}
.bar{height:2px;background:var(--border);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:62%;background:var(--text);transform-origin:0 50%}
.home[data-c="1"] .hide-c{display:none}
.home[data-c="1"] .rh{padding:0;height:20px;border-bottom:0;position:relative}
.home[data-c="1"] .rh span{display:none}
.home[data-c="1"] .rh::after{content:"";position:absolute;left:8px;right:8px;top:10px;height:1px;background:var(--border)}
.home[data-c="1"] #collapse svg{rotate:180deg}

/* Main */
.main{grid-column:2;grid-row:2;overflow:auto;background:var(--canvas);outline:none;scroll-behavior:auto;overscroll-behavior:contain}
.wrap{max-width:1280px;margin:0 auto;padding:40px 40px 96px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hero h1{font:600 30px/1.1 var(--sans);letter-spacing:-.03em;color:var(--text)}
.hero p{margin-top:8px;font-size:14px;color:var(--muted)}
.hero p b{font:500 13px var(--mono);color:var(--text2)}
.hact{display:flex;gap:8px;flex-wrap:wrap}
.btn.lg{height:36px;padding:0 14px}
.btn{transition:background-color .12s,border-color .12s,scale var(--ll-dur-pop) var(--ll-ease-pop)}
.btn:active:not(:disabled){scale:.97}
.btn svg{width:16px;height:16px}
.btn.strong{background:var(--ctl);color:var(--ctl-fg);border-color:var(--ctl)}
.btn.strong:hover{background:var(--ctl);opacity:.9}
.btn:focus-visible{outline-offset:2px}
.btn .aiload{width:16px;height:16px;color:currentColor}

.ph{display:flex;align-items:center;gap:12px;margin:48px 0 16px;min-height:32px;flex-wrap:wrap}
.ph h2{font:600 16px/1.2 var(--sans);letter-spacing:-.01em}
.ph .cnt{font:500 11px var(--mono);color:var(--muted);padding:2px 6px;border:1px solid var(--border);border-radius:var(--r-sm)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tools .dfield{height:32px;background:var(--panel);border-color:var(--border);border-radius:var(--r-md);padding:0 10px;min-width:176px}
.tools .dfield:hover{border-color:var(--muted)}
.tools .dd-f{font:500 12px var(--sans)}
.tools .seg{background:var(--panel)}
.seg button{transition:color .12s,background-color .12s,scale var(--ll-dur-pop) var(--ll-ease-pop)}
.seg button:active{scale:.94}
.seg button svg{width:14px;height:14px}
.seg.ico button{width:28px;padding:0;justify-content:center}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px;position:relative}
.card{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"th th th" "nm cav star" "ed cav star";background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);cursor:pointer;outline:none;text-align:left;color:var(--text);align-content:start;will-change:translate,scale;-webkit-tap-highlight-color:transparent}
.card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;box-shadow:var(--shadow);opacity:var(--so,0);pointer-events:none;z-index:-1}
.card:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.card .th{grid-area:th;position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--canvas);border-bottom:1px solid var(--border);border-radius:7px 7px 0 0;container-type:inline-size;color:var(--text)}
.card .nm{grid-area:nm;padding:12px 0 0 16px;font:500 13px/1.3 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .nm input{all:unset;box-sizing:border-box;width:100%;height:20px;margin:-2px 0;padding:0 4px;margin-left:-4px;background:var(--canvas);outline:2px solid var(--text);border-radius:var(--r-sm);font:500 13px var(--sans)}
.card .ed{grid-area:ed;padding:2px 0 12px 16px;font:400 11px var(--mono);color:var(--muted);white-space:nowrap}
.card .cav{grid-area:cav;display:flex;align-self:center;padding-right:4px;padding-left:4px}
.card .cav .av{width:20px;height:20px;font-size:9px;border-radius:var(--r-sm);margin-left:-4px;box-shadow:0 0 0 1.5px var(--panel)}
.card .cav .av:first-child{margin-left:0}
.card .star{grid-area:star;align-self:center;margin-right:8px;position:relative}
.card .star svg{transition:scale var(--ll-dur-pop) var(--ll-ease-pop),fill .12s}
.card .star[aria-pressed=true]{color:var(--text)}
.card .star[aria-pressed=true] svg{fill:currentColor}
.card .co,.card .cs{display:none}
.card .more{position:absolute;right:8px;top:8px;z-index:2;background:var(--panel);border:1px solid var(--border);opacity:0;scale:.8;transition:opacity .12s,scale var(--ll-dur-pop) var(--ll-ease-pop),background-color .12s}
.card:hover .more,.card:focus-within .more,.card .more[aria-expanded=true]{opacity:1;scale:1}
.card .more:hover{background:var(--hover)}
.card .more svg{width:18px;height:18px}
.card .use{position:absolute;right:8px;bottom:8px;z-index:2;opacity:0;translate:0 4px;background:var(--panel);transition:opacity .12s,translate var(--ll-dur-pop) var(--ll-ease-pop),background-color .12s}
.card:hover .use,.card:focus-within .use{opacity:1;translate:0 0}
.card .use{height:28px;font-size:12px}
.card.gone{display:none}
.bst{position:absolute;width:4px;height:4px;background:var(--text);pointer-events:none}

/* Thumbnail pages (units are container query widths; the page is taller than the thumbnail and pans on hover) */
.pg{position:absolute;left:0;top:0;width:100%;height:calc(var(--ph)*1cqw);background:var(--canvas);color:var(--text);transition:translate .7s cubic-bezier(.2,.8,.2,1);will-change:translate;overflow:hidden}
.pg i,.pg b,.pg svg{position:absolute;display:block;font-style:normal}
.pg b{white-space:nowrap;font-weight:600;letter-spacing:-.035em;line-height:1.05;color:var(--text)}
.pg b.m{font-family:var(--mono);font-weight:500;letter-spacing:0;color:var(--muted)}
.pg b.s{font-weight:500;letter-spacing:-.01em}
.pg b.c{left:0;width:100%;text-align:center}
.pg svg{stroke-width:1.5;overflow:visible}
.f0{background:var(--panel)}.f1{background:var(--seg)}.f2{background:var(--border)}.ft{background:var(--text)}.fm{background:var(--muted)}.fa{background:var(--shipbg)}.fc{background:var(--canvas)}
.bd{border:.25cqw solid var(--border)}
.o5{opacity:.5}.o3{opacity:.3}
.card:hover .pg,.card:focus-visible .pg{translate:0 var(--pan);transition:translate var(--pd,5s) cubic-bezier(.45,.05,.3,1) .12s}

/* New project card */
.newc{grid-template-columns:1fr;grid-template-areas:"n";place-items:center;align-content:center;min-height:240px;gap:4px;background:var(--panel);border-style:solid;color:var(--text2);transition:border-color .12s,color .12s,background-color .12s}
.newc:hover{border-color:var(--text);color:var(--text)}
.newc .nw{grid-area:n;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.newc .nwi{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--border);border-radius:var(--r-md);background:var(--canvas);transition:rotate var(--ll-dur-pop) var(--ll-ease-pop),border-color .12s}
.newc:hover .nwi{rotate:90deg;border-color:var(--text)}
.newc .nwi svg{width:20px;height:20px}
.newc b{font:500 14px var(--sans);color:var(--text)}
.newc small{font:400 11px var(--mono);color:var(--muted)}

/* List view */
.grid.list{display:flex;flex-direction:column;gap:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.list .card{grid-template-columns:40px minmax(0,1fr) 144px 128px 72px 28px 28px;grid-template-areas:"th nm co ed cs star more";align-items:center;column-gap:12px;height:32px;border:0;border-bottom:1px solid var(--border);border-radius:0;padding:0 8px;background:transparent;align-content:center}
.list .card:last-child{border-bottom:0}
.list .card::after{display:none}
.list .card:hover{background:var(--hover)}
.list .card .th{aspect-ratio:auto;width:40px;height:22px;border:1px solid var(--border);border-radius:var(--r-sm)}
.list .card .nm{padding:0;font-weight:500}
.list .card .ed{padding:0;font-size:12px}
.list .card .co,.list .card .cs{display:block;font:400 12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .card .co{font-family:var(--sans);font-size:13px;color:var(--text2)}
.list .card .cav{display:none}
.list .card .star{margin:0}
.list .card .more{position:static;opacity:1;scale:1;border:0;background:none;grid-area:more}
.list .card .more:hover{background:var(--seg)}
.list .card .use{display:none}
.list .newc{grid-template-columns:40px 1fr;grid-template-areas:"i n";height:32px;min-height:0;padding:0 8px;column-gap:12px;place-items:center start;border-bottom:1px solid var(--border);background:transparent}
.list .newc .nw{flex-direction:row;gap:8px;grid-area:n}
.list .newc .nwi{grid-area:i;width:40px;height:22px;border-radius:var(--r-sm)}
.list .newc .nwi svg{width:14px;height:14px}
.list .newc small{display:none}
.list .newc b{font-size:13px}
.list .listhead{display:grid}
.lhead{display:none}
.list .lhead{display:grid;grid-template-columns:40px minmax(0,1fr) 144px 128px 72px 28px 28px;column-gap:12px;padding:0 8px;height:28px;align-items:center;border-bottom:1px solid var(--border);background:var(--canvas)}
.lhead span:nth-child(1){grid-column:2}

/* Templates */
.tmpl{margin-top:56px}
.tmpl .ph{margin:0 0 16px}
.tnav{display:flex;gap:4px}
.tnav .ib{border:1px solid var(--border);background:var(--panel);width:32px;height:32px}
.tnav .ib:hover{background:var(--hover)}
.tnav .ib:disabled{opacity:.4;pointer-events:none}
.trow{overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;margin:-8px -8px 0;padding:8px 8px 24px;scroll-padding-left:8px;overscroll-behavior-x:contain}
.tin{display:flex;gap:24px;width:max-content;will-change:translate}
.tin .card{width:264px;flex:none;scroll-snap-align:start;grid-template-columns:minmax(0,1fr);grid-template-areas:"th" "nm" "ed"}

/* Empty states */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 24px 48px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--panel)}
.empty[hidden]{display:none}
.empty h3{font:600 20px/1.2 var(--sans);letter-spacing:-.02em;margin-top:32px}
.empty p{margin-top:8px;color:var(--muted);font-size:14px;max-width:380px}
.empty .eact{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;justify-content:center}
.stack3{display:flex;align-items:center;justify-content:center;height:112px}
.stile{width:112px;height:84px;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);margin:0 -8px;padding:8px;animation:ll-float 4.2s ease-in-out infinite alternate;animation-delay:var(--d,0s);position:relative}
.stile:nth-child(1){rotate:-6deg;translate:0 4px}
.stile:nth-child(2){z-index:1;scale:1.12;background:var(--panel)}
.stile:nth-child(3){rotate:6deg;translate:0 4px}
.stile svg{width:100%;height:100%}
@keyframes ll-float{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.mag{width:112px;height:112px;display:grid;place-items:center;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--canvas);position:relative}
.mag svg{width:40px;height:40px;color:var(--muted);stroke-width:1.25}
.empty .qk{display:flex;flex-direction:column;gap:0;margin-top:24px;width:min(420px,100%);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;text-align:left}
.empty .qk button{display:flex;align-items:center;gap:12px;height:44px;padding:0 16px;color:var(--text);border-bottom:1px solid var(--border);background:var(--canvas);transition:background-color .12s}
.empty .qk button:last-child{border-bottom:0}
.empty .qk button:hover{background:var(--hover)}
.empty .qk span{flex:1;font-weight:500}
.empty .qk small{font:400 11px var(--mono);color:var(--muted)}

/* Wireframe tiles (project types) */
.wf{width:100%;height:100%;display:block;stroke:none;fill:none;overflow:visible}
.wf .w{fill:var(--panel);stroke:var(--border);stroke-width:1}
.wf .f1{fill:var(--seg);background:none}.wf .ft{fill:var(--text);background:none}.wf .fm{fill:var(--muted);background:none}.wf .f2{fill:var(--border);background:none}.wf .fp{fill:var(--panel);background:none}
.wf .ln{stroke:var(--text);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wf .a{transform-box:fill-box;transform-origin:0 50%}
.wf .ac{transform-box:fill-box;transform-origin:50% 50%}
.wf .ab{transform-box:fill-box;transform-origin:50% 100%}
@keyframes wf-grow{from{transform:scaleX(.15);opacity:.3}to{transform:scaleX(1);opacity:1}}
@keyframes wf-rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes wf-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes wf-bar{from{transform:scaleY(.1)}to{transform:scaleY(1)}}
@keyframes wf-draw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes wf-lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes wf-spin{to{transform:rotate(90deg)}}
@keyframes wf-dash{to{stroke-dashoffset:-16}}
.play .wf .g1,.tile:hover .wf .g1,.tile:focus-visible .wf .g1{animation:wf-grow .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.tile:hover .wf .g2,.tile:focus-visible .wf .g2{animation:wf-rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*80ms)}
.tile:hover .wf .g3,.tile:focus-visible .wf .g3{animation:wf-pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.tile:hover .wf .g4,.tile:focus-visible .wf .g4{animation:wf-bar .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.tile:hover .wf .g5,.tile:focus-visible .wf .g5{stroke-dasharray:200;animation:wf-draw .9s cubic-bezier(.4,0,.2,1) both}
.tile:hover .wf .g6,.tile:focus-visible .wf .g6{animation:wf-lift .8s ease-in-out both;animation-delay:calc(var(--i,0)*90ms)}
.tile:hover .wf .g7,.tile:focus-visible .wf .g7{animation:wf-spin .5s cubic-bezier(.3,1.4,.5,1) both}
.tile:hover .wf .g8,.tile:focus-visible .wf .g8{stroke-dasharray:4 4;animation:wf-dash .6s linear infinite}

/* Overlays: scrim, sheet, AI prompt, toasts, palette, dev menu */
.scrim{position:fixed;inset:0;z-index:50;opacity:0;pointer-events:none;transition:opacity .22s ease-out}
.scrim.on{opacity:1;pointer-events:auto}
.ppop{position:fixed;left:0;top:0;z-index:60;background:var(--float);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);color:var(--text)}
.sheet{z-index:70;width:880px;max-width:calc(100vw - 16px)}
.sh-h{display:flex;align-items:center;gap:16px;height:72px;padding:0 16px 0 24px;border-bottom:1px solid var(--border)}
.sh-h>div{flex:1;min-width:0}
.sh-h h2{font:600 18px/1.2 var(--sans);letter-spacing:-.02em}
.sh-h .sh-s{margin-top:4px;font:400 11px var(--mono);color:var(--muted)}
.sh-b{padding:24px;overflow:auto;max-height:calc(100vh - 220px);overscroll-behavior:contain}
.sh-f{display:flex;align-items:center;gap:8px;height:64px;padding:0 24px;border-top:1px solid var(--border)}
.sh-f .hint{flex:1;font:400 11px var(--mono);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:12px;padding:8px 8px 12px;text-align:left;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-md);transition:border-color .12s,background-color .12s,scale var(--ll-dur-pop) var(--ll-ease-pop);outline:none}
.tile:hover{border-color:var(--text)}
.tile:active{scale:.97}
.tile:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.tile .tp{aspect-ratio:3/2;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px;overflow:hidden}
.tile .tn{padding:0 4px;display:flex;flex-direction:column;gap:2px}
.tile b{font:500 13px var(--sans)}
.tile small{font:400 11px var(--mono);color:var(--muted)}
.f2c{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:32px}
.form{display:flex;flex-direction:column}
.fr{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:16px;min-height:52px;border-bottom:1px solid var(--border);padding:8px 0}
.fr:first-child{padding-top:0}
.fr:last-child{border-bottom:0}
.fr>.micro{align-self:center}
.in{all:unset;box-sizing:border-box;display:block;width:100%;height:32px;padding:0 10px;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-md);font:500 13px var(--sans);color:var(--text);transition:border-color .12s}
.in:hover{border-color:var(--muted)}
.in:focus{border-color:var(--text)}
.in:focus-visible{outline:none}
.fr .seg{width:100%}
.fr .seg button{flex:1;justify-content:center}
.sws{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.swb{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;color:var(--text2);background:var(--canvas);transition:border-color .12s,scale var(--ll-dur-pop) var(--ll-ease-pop)}
.swb:hover{color:var(--text);border-color:var(--muted)}
.swb:active{scale:.95}
.swb[aria-pressed=true]{border-color:var(--text);color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.swb .tpv{width:22px;height:16px}
.sum{display:flex;flex-direction:column;gap:12px;padding:12px;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-md);align-self:start}
.sum .spv{aspect-ratio:3/2;background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;color:var(--text);overflow:hidden}
.sum .spv .wf{transition:opacity .2s}
.sum h3{font:600 15px/1.2 var(--sans);letter-spacing:-.01em;word-break:break-word}
.kv{display:flex;justify-content:space-between;gap:12px;font:400 11px var(--mono);padding:6px 0;border-top:1px solid var(--border)}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{color:var(--text);text-align:right;display:inline-block}
.aip{width:420px;max-width:calc(100vw - 16px);z-index:65}
.aip>.ll-lay{padding:12px;display:flex;flex-direction:column;gap:12px}
.aip textarea{display:block;width:100%;height:76px;margin:0;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--canvas);resize:none;font:400 13px/20px var(--sans);color:var(--text);outline:none}
.aip textarea:focus{border-color:var(--text)}
.aip textarea::placeholder{color:var(--muted)}
.aisg{display:flex;flex-wrap:wrap;gap:6px}
.aisg button{height:24px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:11px;color:var(--text2);background:var(--canvas);transition:background-color .12s,color .12s}
.aisg button:hover{background:var(--hover);color:var(--text)}
.aif{display:flex;align-items:center;gap:8px;min-height:32px}
.aif .aiw{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:13px}
.toasts{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;height:40px;padding:0 8px 0 16px;background:var(--ctl);color:var(--ctl-fg);border-radius:var(--r-md);box-shadow:var(--shadow);font-weight:500;white-space:nowrap}
.toast button{height:28px;padding:0 10px;border-radius:var(--r-sm);color:var(--ctl-fg);border:1px solid color-mix(in srgb,var(--ctl-fg) 35%,transparent);font-size:12px;font-weight:500}
.toast button:hover{background:color-mix(in srgb,var(--ctl-fg) 14%,transparent)}
.toast .aiload{color:var(--ctl-fg);width:16px;height:16px}
.cmdk{z-index:95;top:14vh;transform:translateX(-50%)}
.cki{height:52px}
.cki input::placeholder{color:var(--muted)}
.cko{height:36px;padding:0 12px}
.cko span{display:flex;align-items:center;gap:12px;min-width:0}
.cko svg{color:var(--muted);width:16px;height:16px}
.cko.on svg{color:var(--sel-fg)}
.cko small{font:400 11px var(--mono);color:var(--muted);margin-left:8px}
.cko.on small{color:var(--sel-fg)}
.ckl{max-height:min(420px,60vh)}
.ckh{padding:12px 12px 4px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ckfoot{display:flex;align-items:center;gap:16px;height:36px;padding:0 16px;border-top:1px solid var(--border);color:var(--muted);font:400 11px var(--mono)}
.cknone{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 16px;color:var(--muted);text-align:center}
.cknone .mag{width:56px;height:56px}
.cknone .mag svg{width:24px;height:24px}
.cknone b{font-weight:500;color:var(--text)}
.menu .nr{height:56px!important;white-space:normal!important;align-items:flex-start!important;padding-top:8px!important}
.menu .nr .ico{margin-top:2px}
.menu .nr b{display:block;font-weight:500;color:var(--text)}
.menu .nr small{display:block;font:400 11px var(--mono);color:var(--muted);margin-top:2px}
.menu .nr .ndot{width:6px;height:6px;background:var(--text);border-radius:1px;margin-left:auto;margin-top:6px;flex:none}
.menu .whead{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 12px;border-bottom:1px solid var(--border)}
.menu .whead b{font-weight:500}
.menu .whead button{font-size:12px;color:var(--muted)}
.menu .whead button:hover{color:var(--text)}
.menu .acc{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.menu .acc .av{width:32px;height:32px;border-radius:var(--r-sm);font-size:12px}
.menu .acc b{display:block;font-weight:500}
.menu .acc small{font-size:11px;color:var(--muted)}
.dev{position:fixed;left:12px;bottom:12px;z-index:40}
.devb{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--panel);font:500 11px var(--mono);color:var(--muted);transition:color .12s,scale var(--ll-dur-pop) var(--ll-ease-pop)}
.devb:hover{color:var(--text)}
.devb:active{scale:.95}
.devb svg{width:14px;height:14px}
.devp{position:absolute;left:0;bottom:36px;width:232px;background:var(--float);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);padding:4px;transform-origin:0 100%}
.devp[hidden]{display:none}
.devr{display:flex;align-items:center;gap:12px;width:100%;height:36px;padding:0 8px;border-radius:var(--r-sm);color:var(--text2);text-align:left}
.devr:hover{background:var(--hover);color:var(--text)}
.devr span:first-child{flex:1;font-size:12px}
.tgl{width:32px;height:20px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--canvas);position:relative;flex:none;transition:background-color .12s,border-color .12s}
.tgl i{position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:2px;background:var(--muted);transition:translate var(--ll-dur-pop) var(--ll-ease-pop),background-color .12s,scale .12s}
.devr:active .tgl i{scale:1.35 .8}
.devr[aria-checked=true] .tgl{background:var(--ctl);border-color:var(--ctl)}
.devr[aria-checked=true] .tgl i{translate:12px 0;background:var(--ctl-fg)}

/* Page into editor */
.edl{position:fixed;inset:0;z-index:78;background:var(--canvas);opacity:0;pointer-events:none}
.edl.on{pointer-events:auto}
.edl .eb{position:absolute;left:0;right:0;top:0;height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 10px}
.edl .eb .logo svg{width:20px;height:20px}
.edl .eb b{font-weight:500;font-size:14px}
.edl .ep{position:absolute;top:52px;bottom:0;width:248px;background:var(--panel);border:0 solid var(--border);padding:16px;display:flex;flex-direction:column;gap:10px}
.edl .ep.l{left:0;border-right-width:1px}
.edl .ep.r{right:0;width:320px;border-left-width:1px}
.edl .ep i{display:block;height:8px;background:var(--seg);border-radius:2px}
.zoomer{position:fixed;left:0;top:0;z-index:80;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);will-change:translate,width,height}
.zoomer .th{position:absolute;inset:0;container-type:inline-size;background:var(--canvas)}
.zoomer .pg{transition:none}

/* View transition crossfade for the theme switch */
::view-transition-old(root),::view-transition-new(root){animation-duration:260ms;animation-timing-function:ease-out}
@media (prefers-reduced-motion:reduce){
  .stile{animation:none}
  ::view-transition-old(root),::view-transition-new(root){animation-duration:120ms}
  .pg,.card:hover .pg,.card:focus-visible .pg{transition:none;translate:0 0}
  .wf *{animation:none!important}
}

/* Responsive */
@media (max-width:1100px){
  .srch{width:min(300px,30vw)}
  .wrap{padding:32px 32px 80px}
  .f2c{grid-template-columns:minmax(0,1fr) 232px;gap:24px}
}
@media (max-width:760px){
  .home{grid-template-columns:minmax(0,1fr)}
  .railbtn{display:grid}
  .rail{position:fixed;left:0;top:52px;bottom:0;width:260px;z-index:45;translate:-100% 0;transition:translate .28s cubic-bezier(.2,.8,.2,1);box-shadow:none}
  .home.rail-open .rail{translate:0 0;box-shadow:var(--shadow)}
  .main{grid-column:1}
  .tdiv{display:none}
  .srch{width:32px;padding:0;justify-content:center;justify-self:end;border-color:transparent;background:none;margin-right:0}
  .srch span,.srch kbd{display:none}
  .top{grid-template-columns:minmax(0,1fr) auto minmax(0,auto)}
  .tr{padding-right:8px;gap:0}
  .wrap{padding:24px 16px 80px}
  .hero{align-items:flex-start;flex-direction:column;gap:20px}
  .hero h1{font-size:26px}
  .hact{width:100%}
  .hact .btn{flex:1 1 auto;justify-content:center}
  .ph{margin-top:40px}
  .ph .sp{display:none}
  .tools{width:100%}
  .tools .dfield{flex:1 1 100%}
  .tools .seg{flex:1 1 auto}
  .tools .seg.ico{flex:none;margin-left:auto}
  .grid{grid-template-columns:minmax(0,1fr);gap:16px}
  .list .card{grid-template-columns:40px minmax(0,1fr) 28px 28px;grid-template-areas:"th nm star more"}
  .list .card .co,.list .card .cs,.list .card .ed,.list .lhead{display:none}
  .tin .card{width:232px}
  .f2c{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sh-b{padding:16px}
  .sh-h{padding-left:16px}
  .sh-f{padding:0 16px}
  .fr{grid-template-columns:minmax(0,1fr);gap:8px}
  .sws{grid-template-columns:repeat(2,minmax(0,1fr))}
  .empty{padding:48px 16px 32px}
  .toast{max-width:calc(100vw - 32px)}
  .edl .ep{display:none}
}
.grid[hidden]{display:none}
.card .star[aria-pressed=true]{background:none}
.card .star:hover{background:var(--seg)}
html{overflow:hidden}
#menu,#sub,#dd{left:0;top:0}
.tile .tp{padding:0;border:0;background:none;border-radius:0}
html[data-theme=warm],html[data-theme=paper],html[data-theme=white],html[data-theme=lilac]{--scrim:color-mix(in srgb,var(--text) 34%,transparent)}
html[data-theme=dark],html[data-theme=graphite],html[data-theme=darkroom],html[data-theme=noir]{--scrim:color-mix(in srgb,var(--backdrop) 74%,transparent)}
.scrim{background:var(--scrim)}
.empty .qk span{text-align:left}
.card .cav .av{margin-left:-2px}
@media (max-width:760px){
  .newc{min-height:88px}
  .newc .nw{flex-direction:row;gap:16px}
  .newc small{display:none}
  .dev{left:auto;right:12px}
  .devp{left:auto;right:0;transform-origin:100% 100%}
}

</style>
</head>

<div class="home" id="hm" data-c="0">
  <header class="top">
    <div class="tl">
      <button class="ib railbtn" id="railbtn" aria-label="Toggle sidebar" aria-expanded="false"><svg><use href="#panel"/></svg></button>
      <button class="logo" id="logob" aria-label="Lazy Layout, home"><svg viewBox="0 0 256 256" aria-hidden="true"><path class="tro" pathLength="100" d="M256 256H128L0 128H128ZM256 128H128L0 0H128Z"/><path class="tfl" d="M256 256H128L0 128H128ZM256 128H128L0 0H128Z"/></svg><span class="sr" id="saving" role="status"></span></button>

      <button class="pagebtn" id="wsbtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Workspace"><span id="wslabel">Personal</span><svg><use href="#chevd"/></svg></button>
    </div>
    <button class="srch" id="srch" aria-label="Search projects" aria-haspopup="dialog"><svg><use href="#search"/></svg><span>Search projects…</span><kbd>Ctrl K</kbd></button>

    function ok(s){s=s.toLowerCase();return words.every(function(w){return s.indexOf(w)>-1})}
    P.filter(function(p){return !p.trash&&ok(p.name)}).sort(function(a,b){return a.ed-b.ed}).forEach(function(p){items.push({g:'Projects',t:p.name,ic:'frame',h:'Edited '+ago(p.ed),f:function(){openProject(p.id)}})});
    TPL.filter(function(t){return ok(t.name+' template')}).forEach(function(t){items.push({g:'Templates',t:t.name,ic:'tmpli',h:'Template',f:function(){openSheet($('#bnew'),{type:t.type,theme:t.theme,step:2})}})});
    actions().filter(function(a){return ok(a.t)}).forEach(function(a){items.push({g:'Actions',t:a.t,ic:a.ic,h:a.h,f:a.f})});
    return items;
  }
  function ckRender(){
    var q=$('#ckin').value.trim(),h='',g='';
    ckList=ckItems(q);ckI=clamp(ckI,0,Math.max(0,ckList.length-1));
    if(!ckList.length){$('#ckl').innerHTML='<div class="cknone"><div class="mag">'+ICO('search')+'</div><div><b>No results for “'+esc(q)+'”</b><br>Try a project name or an action.</div></div>';return}
    ckList.forEach(function(c,i){if(c.g!==g){g=c.g;h+='<div class="ckh" role="presentation">'+g+'</div>'}h+='<div class="cko'+(i===ckI?' on':'')+'" role="option" aria-selected="'+(i===ckI)+'" data-i="'+i+'"><span>'+ICO(c.ic)+c.t+'</span>'+(c.h?'<small>'+c.h+'</small>':'')+'</div>'});
    $('#ckl').innerHTML=h;
  }
  function ckOpen(){
    if(!CK.hidden)return;
    ckPrev=document.activeElement;closeAll();CK.hidden=false;$('#ckin').value='';ckI=0;ckRender();scrim.classList.add('on');
    springAnim(CK,[{scale:'.95',translate:'0 -10px'},{scale:'1',translate:'0 0'}],.34,.55);
    CK.animate([{opacity:0},{opacity:1}],{duration:140,fill:'backwards'});
    $('#ckin').focus();
  }
  function ckClose(run){
    if(CK.hidden)return;
    var cm=run!=null?ckList[run]:null;
    scrim.classList.remove('on');
    CK.animate([{opacity:1,scale:'1'},{opacity:0,scale:'.97'}],{duration:130,easing:'ease-out',fill:'forwards'}).onfinish=function(){CK.hidden=true;CK.getAnimations().forEach(function(a){a.cancel()});if(cm)cm.f();else if(ckPrev&&document.contains(ckPrev))ckPrev.focus()};
  }
  $('#ckin').addEventListener('input',function(){ckI=0;ckRender()});
  CK.addEventListener('keydown',function(e){
    if(e.key==='Escape'){e.stopPropagation();ckClose()}
    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(ckList.length){ckI=(ckI+(e.key==='ArrowDown'?1:ckList.length-1))%ckList.length;ckRender();var o=$('.cko.on',CK);if(o)o.scrollIntoView({block:'nearest'})}}
    else if(e.key==='Enter'){e.preventDefault();if(ckList.length)ckClose(ckI)}
  });
  CK.addEventListener('click',function(e){var o=e.target.closest('.cko');if(o)ckClose(+o.dataset.i)});
  CK.addEventListener('mousemove',function(e){var o=e.target.closest('.cko');if(o&&+o.dataset.i!==ckI){ckI=+o.dataset.i;$$('.cko',CK).forEach(function(x){x.classList.toggle('on',x===o);x.setAttribute('aria-selected',String(x===o))})}});
  scrim.addEventListener('click',function(){if(!CK.hidden)ckClose();else if(sheetOpen())closeSheet()});
  $('#srch').addEventListener('click',ckOpen);

  /* ---------- Menus: account, notifications ---------- */
  var NOTES=[['users','Rina invited you to Docs','12m ago',1],['star','Sam starred Event page','2h ago',1],['card','Your Studio plan renews on Nov 14','1d ago',1]];
  function menuAct(a){
    if(a==='read'){$('#bellc').style.display='none';$('#bellb').setAttribute('aria-label','Notifications');return}
    if(a==='settings')toast('Settings open in a new window');
    else if(a==='billing')toast('Opening billing…');
    else if(a==='out')toast('Signed out of this session (demo)');
    else if(a==='note')toast('Opening notification…');
  }
  $('#bellb').addEventListener('click',function(){
    var rows=NOTES.map(function(n){return '<button role="menuitem" class="nr" data-act="note"><span class="ico">'+ICO(n[0])+'</span><span><b>'+n[1]+'</b><small>'+n[2]+'</small></span>'+($('#bellc').style.display==='none'?'':'<i class="ndot"></i>')+'</button>'}).join('');
    openMenu(this,'<div class="whead"><b>Notifications</b><button data-act="read">Mark all read</button></div>'+rows,{kind:'notif',cls:'wide',right:true});
  });
  $('#acct').addEventListener('click',function(){
    openMenu(this,'<div class="acc"><span class="av">AP</span><span><b>Adarsh Pathade</b><small>adarsh@lazylayout.app</small></span></div><button role="menuitem" data-act="settings"><span class="ico">'+ICO('gear')+'</span>Settings<kbd>Ctrl ,</kbd></button><button role="menuitem" data-act="billing"><span class="ico">'+ICO('card')+'</span>Billing</button><div class="hl"></div><button role="menuitem" data-act="out"><span class="ico">'+ICO('logout')+'</span>Sign out</button>',{kind:'acct',cls:'ctx',right:true});
  });
  $('#wsbtn').addEventListener('click',function(){ddOpen(cfgOf(this),false)});
  mm.addEventListener('click',function(e){
    e.stopPropagation();
    var t=e.target.closest('button');if(!t||t.disabled)return;
    var d=t.dataset;
    if(d.sub){openSub(t);return}
    if(d.n!=null){pick(mm,t);return}
    if(d.act==='read'){menuAct('read');var dots=$$('.ndot',mm);dots.forEach(function(x){x.animate([{scale:'1',opacity:1},{scale:'0',opacity:0}],{duration:200,fill:'forwards'})});return}
    if(d.act){menuAct(d.act);closeAll();popRow(t)}
  });
  sbm.addEventListener('click',function(e){e.stopPropagation();var t=e.target.closest('[role=menuitem]');if(t&&!t.disabled)pick(sbm,t)});

  function closeAll(){
    ddClose(false);
    var a=mm.classList.contains('open')?mm.anchor:null;
    mm.sf.leave();closeSub();aiClose();devClose();
    mm.anchor=null;
    $$('[aria-haspopup][aria-expanded="true"]').forEach(function(x){x.setAttribute('aria-expanded','false')});
    if(a&&(mm.contains(document.activeElement)||document.activeElement===document.body))a.focus({preventScroll:true});
  }
  document.addEventListener('click',function(e){
    if(e.target.closest('.menu,.ppop,.cmdk,[aria-haspopup],.toast,.dev'))return;
    closeAll();
  });

  /* ---------- Dev menu ---------- */
  var devp=$('#devp');
  function devClose(){if(devp.hidden)return;devp.hidden=true;$('#devb').setAttribute('aria-expanded','false')}
  $('#devb').addEventListener('click',function(){
    if(!devp.hidden){devClose();return}
    closeAll();devp.hidden=false;this.setAttribute('aria-expanded','true');
    springAnim(devp,[{scale:'.9',translate:'0 6px'},{scale:'1',translate:'0 0'}],.28,.5);devp.animate([{opacity:0},{opacity:1}],{duration:120,fill:'backwards'});
  });
  function syncDev(){$$('.devr',devp).forEach(function(r){r.setAttribute('aria-checked',String(S.force===r.dataset.dev))})}
  devp.addEventListener('click',function(e){
    var r=e.target.closest('.devr');if(!r)return;
    var k=r.dataset.dev;S.force=S.force===k?null:k;
    syncDev();
    if(S.force==='trash'){S.view='trash';setNav('trash')}else if(S.view==='trash'){S.view='home';setNav('home')}
    layout({stagger:12,blur:true});
  });

  /* ---------- View mode, sort, filter ---------- */
  function setMode(m){
    if(S.mode===m)return;S.mode=m;syncSeg('#vseg','v',m);
    layout({stagger:10,blur:true});
  }
  $('#vseg').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setMode(b.dataset.v)});
  $('#fseg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||S.filter===b.dataset.f)return;S.filter=b.dataset.f;syncSeg('#fseg','f',S.filter);S.force=null;syncDev();layout({stagger:18})});
  $('#sortf .dnat').addEventListener('change',function(){S.sort=this.value;layout({stagger:18})});

  /* ---------- Grid events ---------- */
  grid.addEventListener('click',function(e){
    var c=e.target.closest('.card');if(!c||e.target.closest('input'))return;
    var id=c.dataset.id;
    if(id==='new'){openSheet(c);return}
    if(e.target.closest('.star')){toggleStar(id);return}
    var mb=e.target.closest('.more');
    if(mb){var r=mb.getBoundingClientRect();if(mb.getAttribute('aria-expanded')==='true'){closeAll();return}closeAll();mb.setAttribute('aria-expanded','true');menuAt(id,r.right-8,r.bottom+4);return}
    if(byId(id).trash){menuAt(id,e.clientX,e.clientY);return}
    openProject(id);
  });
  grid.addEventListener('contextmenu',function(e){var c=e.target.closest('.card');if(!c||c.dataset.id==='new')return;e.preventDefault();menuAt(c.dataset.id,e.clientX,e.clientY)});
  grid.addEventListener('keydown',function(e){
    var c=e.target.closest('.card');if(!c||e.target!==c)return;
    var id=c.dataset.id;
    if(e.key==='Enter'||e.key===' '){e.preventDefault();if(id==='new')openSheet(c);else openProject(id)}
    else if((e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10'))&&id!=='new'){e.preventDefault();var r=c.getBoundingClientRect();menuAt(id,r.left+24,r.top+24)}
    else if(e.key==='F2'&&id!=='new'){e.preventDefault();startRename(id)}
    else if(e.key==='Delete'&&id!=='new'){e.preventDefault();removeP(id)}
  });
  empty.addEventListener('click',function(e){
    var b=e.target.closest('[data-q]');if(!b)return;
    var q=b.dataset.q;
    if(q==='ai')aiOpen();
    else if(q==='new')openSheet(b);
    else if(q==='tmpl')setView('templates');
    else if(q==='clear'){S.filter='all';S.force=null;syncDev();syncSeg('#fseg','f','all');layout({stagger:14})}
    else if(q==='home'){S.force=null;syncDev();setView('home')}
  });
  tin.addEventListener('click',function(e){
    var c=e.target.closest('.card');if(!c)return;
    var t=TPL.filter(function(x){return x.id===c.dataset.t})[0];
    openSheet(c,{type:t.type,theme:t.theme,step:2});
  });
  tin.addEventListener('keydown',function(e){var c=e.target.closest('.card');if(c&&e.target===c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();c.click()}});

  /* ---------- Templates row: snap scroll with the end bump ---------- */
  var TB=new Spring(0,[.36,.5]),tbSim={sp:[TB],apply:function(){tin.style.translate=TB.x.toFixed(2)+'px 0'}};
  function tBump(dir){if(reduced())return;TB.v+=dir*mo().endBump*.45;TB.to=0;simAdd(tbSim)}
  function atEnd(d){return d<0?trow.scrollLeft<=1:trow.scrollLeft>=trow.scrollWidth-trow.clientWidth-1}
  trow.addEventListener('wheel',function(e){
    var d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:(e.shiftKey?e.deltaY:0);
    if(!d)return;
    if(atEnd(d)&&Math.abs(d)>=4&&Date.now()>(trow._lock||0)){tBump(d>0?-1:1);trow._lock=Date.now()+mo().lock}
  },{passive:true});
  $('#tprev').addEventListener('click',function(){if(atEnd(-1)){tBump(1);return}trow.scrollBy({left:-(288*2),behavior:reduced()?'auto':'smooth'})});
  $('#tnext').addEventListener('click',function(){if(atEnd(1)){tBump(-1);return}trow.scrollBy({left:288*2,behavior:reduced()?'auto':'smooth'})});
  (function(){
    var down=false,sx=0,sl=0,moved=0;
    trow.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('button'))return;down=true;sx=e.clientX;sl=trow.scrollLeft;moved=0});
    window.addEventListener('pointermove',function(e){
      if(!down)return;var dx=e.clientX-sx;moved=Math.max(moved,Math.abs(dx));
      if(moved>4){trow.style.scrollSnapType='none';trow.classList.add('drag')}
      if(moved<=4)return;
      var max=trow.scrollWidth-trow.clientWidth,t=sl-dx;
      if(t<0){trow.scrollLeft=0;TB.x=-t*.35;TB.v=0;tbSim.apply()}
      else if(t>max){trow.scrollLeft=max;TB.x=-(t-max)*.35;TB.v=0;tbSim.apply()}
      else{trow.scrollLeft=t;TB.x=0;tbSim.apply()}
    });
    window.addEventListener('pointerup',function(){
      if(!down)return;down=false;
      if(moved>4){TB.to=0;simAdd(tbSim);trow.style.scrollSnapType='';trow._swallow=Date.now()+50}
    });
    trow.addEventListener('click',function(e){if(moved>4&&Date.now()<(trow._swallow||0)+300){e.stopPropagation();e.preventDefault();moved=0}},true);
  })();

  /* ---------- Rail events ---------- */
  rnav.addEventListener('click',function(e){
    var b=e.target.closest('.ri');if(!b)return;
    if(b.id==='newfolder'){
      var n='Folder '+(FOLDERS.length+1);FOLDERS.push(n);
      $('#folders').insertAdjacentHTML('beforeend','<button class="ri" data-v="fld:'+n+'">'+ICO('folder')+'<span class="rl">'+n+'</span><span class="rc" data-fc="'+(FOLDERS.length-1)+'">0</span></button>');
      var nb=$('#folders').lastElementChild;springAnim(nb,[{scale:'.9',translate:'0 -6px'},{scale:'1',translate:'0 0'}],.3,.5);
      toast('Created “'+n+'”');rnavSync();return;
    }
    setView(b.dataset.v);
  });
  $('#collapse').addEventListener('click',function(){railTo(home.dataset.c!=='1',true)});
  $('#railbtn').addEventListener('click',function(){var o=home.classList.toggle('rail-open');this.setAttribute('aria-expanded',String(o))});
  $('#upgrade').addEventListener('click',function(){toast('Plans open in a new tab')});
  $('#helpb').addEventListener('click',function(){toast('Help and shortcuts: press Ctrl K')});
  $('#logob').addEventListener('click',function(){setView('home')});
  $('#bnew').addEventListener('click',function(){openSheet(this)});
  $('#bimp').addEventListener('click',function(){toast('Drop a project file or paste a link to import',{act:'Browse',fn:function(){}})});
  $('#themebtn').addEventListener('click',function(){closeAll();setTheme(LIGHT.indexOf(curTheme())>-1?'darkroom':'warm')});
  window.addEventListener('resize',function(){rnavSync()});

  /* ---------- Keyboard ---------- */
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(CK.hidden)ckOpen();else ckClose();return}
    if(e.ctrlKey&&e.key==='\\'){e.preventDefault();railTo(home.dataset.c!=='1',true);return}
    if(e.key==='Escape'){
      if(!CK.hidden)return;
      if(sheetOpen()){closeSheet();return}
      if(sbm.classList.contains('open')&&mm.classList.contains('open')){e.preventDefault();closeSub();return}
      closeAll();home.classList.remove('rail-open');return;
    }
    if(mm.classList.contains('open')&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&keyNav(e))return;
  });

  /* ---------- Intro ---------- */
  function rise(el,d,dy){
    if(!el)return;
    springAnim(el,[{translate:'0 '+(dy==null?14:dy)+'px',scale:'.97'},{translate:'0 0',scale:'1'}],.42,.6,{delay:d,fill:'backwards'});
    if(!reduced()){el.animate([{opacity:0,filter:'blur(6px)'},{opacity:1,filter:'blur(0px)'}],{duration:320,delay:d,easing:'cubic-bezier(.2,.8,.3,1)',fill:'backwards'})}
  }
  function intro(){
    var h=new Date().getHours();
    $('#greet').textContent=(h<5||h>=18?'Good evening':h<12?'Good morning':'Good afternoon')+', Adarsh';
    rise($('#greet'),0,10);rise($('#gsub'),50,10);
    $$('#hact .btn').forEach(function(b,i){rise(b,140+i*50,10)});
    rise($('.ph',$('#proj')),240,8);
    $$('#pgrid .card:not(.gone)').forEach(function(c,i){rise(c,300+i*30,22)});
    rise($('#tmpl'),700,14);
    var bar=$('#storbar');if(bar&&!reduced())bar.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:900,delay:400,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'});
  }

  /* ---------- Boot ---------- */
  buildStatic();
  themeSync();
  railTo(lsGet('ll-home-rail','0')==='1',false);
  S.mode='grid';
  layout({stagger:0});
  (function(){var f=false;try{f=new URLSearchParams(location.search).get('empty')}catch(_){}if(f){S.force=f;syncDev();layout({stagger:0})}})();
  rnavSync();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(rnavSync);
  intro();

})();
</script>
</body>
</html>
