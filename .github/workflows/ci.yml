# ROADMAP Phase 1.4 — every push and PR must typecheck, lint, test and build.
# ROADMAP Phase 6 — plus the edition=initial bundle-scope gate and a doc-link check.
# ROADMAP Phase 8.4 — plus the editor ad-hoc-compatibility grep gate.
# ROADMAP Sub-Phase 41.1 — plus a second unit-test pass with NEXT_PUBLIC_EDITION=full,
# since the After-track store split added real edition-dependent logic (not just
# bundle inclusion) for the first time.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (0 errors, warning budget enforced)
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Unit tests (full edition — After-track behavior, Sub-Phase 41.1)
        run: npm run test:unit:full-edition

      - name: Production build
        run: npm run build

      - name: Bundle scope (edition=initial excludes After-track panels)
        run: npm run check:bundle-scope

      - name: Doc links (DOCS/INITIAL)
        run: npm run check:doc-links

      - name: No ad-hoc compatibility logic in the editor (Phase 8.4)
        run: npm run check:no-adhoc-compat

      - name: Roadmap order (Phase 13, Law 18)
        run: npm run check:roadmap-order

  # ROADMAP Phase 4.1 — the Phase 3 and Phase 4 browser gates, in CI, on
  # every push/PR, on Chromium, Firefox and WebKit (playwright.config.ts).
  # Run in parallel across browsers to reduce wall-clock execution time.
  e2e-matrix:
    name: Browser E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Browser E2E (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report (${{ matrix.browser }})
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

  # Stable aggregate E2E status gate for branch protection and PR gating.
  e2e:
    name: E2E
    needs: e2e-matrix
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Check browser E2E results
        env:
          E2E_RESULT: ${{ needs.e2e-matrix.result }}
        run: |
          if [ "$E2E_RESULT" != "success" ]; then
            echo "One or more browser E2E jobs failed or were cancelled."
            exit 1
          fi
          echo "All browser E2E jobs passed."
